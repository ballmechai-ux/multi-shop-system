<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ป้ายราคา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg1:#0f172a; --bg2:#1e293b; --card:#1e293b; --accent:#3b82f6; --accent2:#2563eb;
    --text:#f1f5f9; --sub:#94a3b8; --danger:#ef4444; --ok:#22c55e; --border:#334155;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Sarabun',sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh; color:var(--text); padding:14px; padding-bottom:60px;
  }
  .wrap{ max-width:640px; margin:0 auto; }

  @media (min-width:900px){
    .wrap{ max-width:900px; }
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .topbar h1{ font-family:'Kanit'; font-size:18px; }
  .topbar .who{ font-size:11px; color:var(--sub); text-align:right; }

  .nav-bar{ display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; padding-bottom:4px; }

  @media (min-width:700px){
    .nav-bar{ flex-wrap:wrap; overflow-x:visible; }
  }
  .nav-bar::-webkit-scrollbar{ display:none; }
  .nav-item{
    flex:0 0 auto; background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:8px 14px; font-size:12px; color:var(--sub); cursor:pointer; white-space:nowrap; text-decoration:none;
  }
  .nav-item.active{ border-color:var(--accent); color:#93c5fd; background:#2563eb22; }

  .current-shop-banner{
    display:flex; align-items:center; gap:8px; background:#2563eb22; border:1px solid var(--accent);
    border-radius:14px; padding:10px 14px; margin-bottom:12px; font-family:'Kanit'; font-size:14px; color:#93c5fd;
  }
  .current-shop-banner .pin{ font-size:16px; }

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:18px; margin-bottom:14px;
  }
  .card h2{ font-family:'Kanit'; font-size:15px; margin-bottom:12px; }
  label{ font-size:12.5px; color:var(--sub); display:block; margin-bottom:5px; }
  input, select{
    width:100%; padding:12px 13px; margin-bottom:10px; border-radius:12px;
    border:1px solid var(--border); background:#0f172a; color:var(--text); font-size:14px; font-family:'Sarabun';
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .search-row{ display:flex; gap:8px; margin-bottom:10px; }
  .search-row input{ flex:1; margin-bottom:0; }
  .scan-btn{
    background:#0f172a; border:1px solid var(--border); border-radius:12px;
    padding:0 16px; font-size:18px; cursor:pointer;
  }
  .search-results{ max-height:220px; overflow-y:auto; }
  .search-item{
    background:#0f172a; border:1px solid var(--border); border-radius:10px; padding:10px 12px;
    margin-bottom:6px; cursor:pointer; display:flex; justify-content:space-between; font-size:13px;
  }
  .search-item:active{ border-color:var(--accent); }

  .selected-name{ font-family:'Kanit'; font-size:16px; margin-bottom:4px; }
  .selected-meta{ font-size:12px; color:var(--sub); margin-bottom:14px; }
  .change-btn{ color:var(--accent); font-size:12.5px; cursor:pointer; }

  .barcode-preview{
    background:#fff; border-radius:12px; padding:14px; text-align:center; margin-bottom:12px;
  }
  .barcode-preview svg{ max-width:100%; }
  .no-barcode-note{ text-align:center; color:var(--sub); font-size:12.5px; padding:20px 0; }

  .tag-preview{
    background:#fff; color:#000; border-radius:10px; padding:12px; text-align:center;
    max-width:220px; margin:0 auto 14px; border:1px dashed #94a3b8;
  }
  .tag-preview .tshop{ font-size:10px; color:#555; }
  .tag-preview .tname{ font-family:'Kanit'; font-size:13px; margin:4px 0; }
  .tag-preview .tprice-row{ display:flex; align-items:baseline; justify-content:center; gap:6px; }
  .tag-preview .torig{ text-decoration:line-through; color:#999; font-size:12px; }
  .tag-preview .tprice{ font-family:'Kanit'; font-size:20px; font-weight:700; }
  .tag-preview svg{ max-width:100%; margin-top:6px; }

  .btn{
    width:100%; padding:14px; border:none; border-radius:12px; background:var(--accent);
    color:#fff; font-family:'Kanit'; font-size:15px; font-weight:500; cursor:pointer; margin-top:6px;
  }
  .btn.outline{ background:transparent; border:1px solid var(--border); color:var(--sub); }
  .msg{ font-size:13px; margin-top:8px; min-height:16px; }
  .msg.error{ color:var(--danger); }
  .msg.ok{ color:var(--ok); }

  .empty-note{ text-align:center; color:var(--sub); font-size:13px; padding:20px 14px; }
  .blocked{ text-align:center; padding:60px 20px; color:var(--sub); }
  .blocked h1{ font-family:'Kanit'; color:var(--text); font-size:20px; margin-bottom:10px; }

  .scan-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.75); display:none;
    align-items:center; justify-content:center; z-index:80; padding:16px;
  }
  .scan-overlay.show{ display:flex; }
  .scan-sheet{
    background:#0b1222; border-radius:20px; padding:16px; width:100%; max-width:420px;
    border:1px solid var(--border);
  }
  .scan-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .scan-head h3{ font-family:'Kanit'; font-size:15px; }
  .scan-close{ color:var(--sub); font-size:20px; cursor:pointer; }
  #scanReaderBox{ border-radius:12px; overflow:hidden; background:#000; min-height:220px; }
  .scan-error{ color:var(--danger); font-size:13px; text-align:center; padding:12px 0; }
  .scan-manual{ display:flex; gap:8px; margin-top:12px; }
  .scan-manual input{ flex:1; margin-bottom:0; padding:11px 12px; border-radius:10px; border:1px solid var(--border); background:#0f172a; color:var(--text); font-size:14px; }
  .scan-manual button{ background:var(--accent); border:none; border-radius:10px; color:#fff; padding:0 16px; font-family:'Kanit'; font-size:13px; cursor:pointer; }

  #printArea{ position:absolute; left:-9999px; top:0; }
  .print-tags-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .print-tag{
    width:200px; padding:10px; text-align:center; border:1px dashed #999; box-sizing:border-box;
  }
  .print-tag .pshop{ font-size:9px; color:#555; }
  .print-tag .pname{ font-family:'Kanit'; font-size:12px; margin:3px 0; }
  .print-tag .pprice-row{ display:flex; align-items:baseline; justify-content:center; gap:5px; }
  .print-tag .porig{ text-decoration:line-through; color:#999; font-size:11px; }
  .print-tag .pprice{ font-family:'Kanit'; font-size:18px; font-weight:700; }
  .print-barcode-strip{ padding:8px; text-align:center; border:1px dashed #999; margin-bottom:6px; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ position:absolute; left:0; top:0; }
  }
</style>
</head>

// ---------- Shared camera barcode scanner ----------
let html5QrCode = null;
function ensureScanModal(){
  let overlay = document.getElementById('scanModalOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'scanModalOverlay';
    overlay.className = 'scan-overlay';
    overlay.innerHTML = `
      <div class="scan-sheet">
        <div class="scan-head"><h3>📷 สแกนบาร์โค้ด</h3><span class="scan-close" id="scanCloseBtn">✕</span></div>
        <div id="scanReaderBox"></div>
        <div id="scanErrorBox"></div>
        <div class="scan-manual">
          <input id="scanManualInput" placeholder="หรือพิมพ์บาร์โค้ดเอง">
          <button id="scanManualBtn">ตกลง</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
  }
  return overlay;
}
function openScanner(onResult){
  const overlay = ensureScanModal();
  overlay.classList.add('show');
  document.getElementById('scanErrorBox').innerHTML = '';
  document.getElementById('scanManualInput').value = '';
  document.getElementById('scanCloseBtn').onclick = ()=> closeScanner();
  document.getElementById('scanManualBtn').onclick = ()=>{
    const v = document.getElementById('scanManualInput').value.trim();
    if(v){ closeScanner(); onResult(v); }
  };
  html5QrCode = new Html5Qrcode("scanReaderBox");
  Html5Qrcode.getCameras().then(cameras=>{
    if(!cameras || cameras.length === 0){ showScanError('ไม่พบกล้องในอุปกรณ์นี้ — พิมพ์บาร์โค้ดเองด้านล่างแทนได้'); return; }
    const backCam = cameras.find(c=>/back|rear|environment/i.test(c.label));
    const camId = backCam ? backCam.id : cameras[cameras.length-1].id;
    html5QrCode.start(camId, { fps:10, qrbox:{ width:250, height:150 } },
      (decodedText)=>{ closeScanner(); onResult(decodedText); },
      ()=>{}
    ).catch(()=> showScanError('เปิดกล้องไม่สำเร็จ — ตรวจสอบว่าอนุญาตให้เว็บนี้ใช้กล้องแล้ว หรือพิมพ์บาร์โค้ดเองด้านล่าง'));
  }).catch(()=> showScanError('ไม่ได้รับอนุญาตให้ใช้กล้อง — พิมพ์บาร์โค้ดเองด้านล่างแทนได้'));
}
function showScanError(msg){ const box = document.getElementById('scanErrorBox'); if(box) box.innerHTML = `<div class="scan-error">${msg}</div>`; }
function closeScanner(){
  const overlay = document.getElementById('scanModalOverlay');
  if(overlay) overlay.classList.remove('show');
  if(html5QrCode){ html5QrCode.stop().then(()=> html5QrCode.clear()).catch(()=>{}); html5QrCode = null; }
}

let shopsCache = {};
let branchOptions = [];
let currentBranch = null;
let productsCache = {};
let tagQueue = [];
let previewIdx = 0;
let shopSettings = {};
let promosCache = {};

function getActivePromo(productId){
  const promoId = Object.keys(promosCache).find(id =>
    promosCache[id].productId === productId && promosCache[id].active !== false
  );
  return promoId ? promosCache[promoId] : null;
}

function boot(){
  db.ref('shops').on('value', snap=>{
    shopsCache = snap.val() || {};
    buildBranchOptions();
    renderShell();
  });
}

function buildBranchOptions(){
  branchOptions = [];
  Object.keys(shopsCache).forEach(shopId=>{
    const shop = shopsCache[shopId];
    const info = shop.info || {};
    const branches = shop.branches || {};
    const branchIds = Object.keys(branches);
    let allowed = branchIds;
    if(session.role !== 'admin'){
      const access = session.access || {};
      if(!access[shopId]) return;
      allowed = branchIds.filter(bid => access[shopId][bid]);
    }
    allowed.forEach(bid=>{
      branchOptions.push({ shopId, shopName: info.name, branchId: bid, branchName: branches[bid].name });
    });
  });
  if(!currentBranch && branchOptions.length){
    currentBranch = pickInitialBranch(branchOptions);
  }
}

function pickInitialBranch(options){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem('currentShopBranch')); }catch(e){}
  if(saved && options.some(b=>b.shopId===saved.shopId && b.branchId===saved.branchId)){
    return { shopId: saved.shopId, branchId: saved.branchId };
  }
  return { shopId: options[0].shopId, branchId: options[0].branchId };
}

function renderShell(){
  const roleLabel = {admin:'ADMIN', owner:'OWNER', staff:'STAFF'}[session.role] || session.role;
  app.innerHTML = `
    <div class="wrap">
      <div class="topbar">
        <h1>🏷️ ป้ายราคา</h1>
        <div class="who">${session.name}<br><span style="color:#93c5fd">${roleLabel}</span></div>
      </div>
      <div class="nav-bar" id="navBar"></div>
      <div class="current-shop-banner" id="currentShopBanner"></div>
      <div id="mainContent"></div>
    </div>
  `;
  renderNavBar();
  renderBanner();
  renderMainContent();
}

function renderNavBar(){
  const wrap = document.getElementById('navBar');
  const items = [
    { href:'dashboard.html', icon:'🏠', label:'Dashboard', show:true },
    { href:'sell.html', icon:'🛒', label:'ขายสินค้า', show: session.role==='admin' || (session.permissions&&session.permissions.sell) },
    { href:'products.html', icon:'📦', label:'สินค้า', show:true },
    { href:'stock.html', icon:'📊', label:'สต็อก', show:true },
    { href:'receive.html', icon:'📥', label:'รับสินค้าเข้า', show:true },
    { href:'pricetag.html', icon:'🏷️', label:'ป้ายราคา', show:true },
    { href:'promotions.html', icon:'🔥', label:'โปรโมชั่น', show:true },
    { href:'sales.html', icon:'🧾', label:'รายการขาย', show:true },
    { href:'reports.html', icon:'📈', label:'รายงาน', show: session.role==='admin' || (session.permissions&&session.permissions.viewReport) },
    { href:'shops.html', icon:'🏪', label:'ร้าน/สาขา', show: session.role==='admin' },
    { href:'staffs.html', icon:'👨‍💼', label:'พนักงาน', show: session.role==='admin' },
    { href:'settings.html', icon:'⚙️', label:'ตั้งค่า', show: session.role==='admin' || (session.permissions&&session.permissions.manageSystem) }
  ];
  wrap.innerHTML = items.filter(i=>i.show).map(i=>
    `<a class="nav-item ${i.href==='pricetag.html'?'active':''}" href="${i.href}">${i.icon} ${i.label}</a>`
  ).join('');
}

function renderBanner(){
  const banner = document.getElementById('currentShopBanner');
  if(!banner) return;
  if(branchOptions.length === 0){
    banner.style.display = 'flex';
    banner.innerHTML = `ยังไม่มีร้าน/สาขาที่เข้าถึงได้`;
    return;
  }
  const cur = branchOptions.find(b=>b.shopId===currentBranch.shopId && b.branchId===currentBranch.branchId);
  if(cur){
    banner.style.display = 'flex';
    banner.innerHTML = `<span class="pin">📍</span> กำลังสร้างป้ายราคาให้ร้าน: <b>${cur.shopName} · ${cur.branchName}</b><a href="home.html" style="margin-left:auto; color:inherit; text-decoration:underline; font-size:12px;">🔄 เปลี่ยนร้าน</a>`;
  }
}

function renderMainContent(){
  const content = document.getElementById('mainContent');
  if(!currentBranch){
    content.innerHTML = `<div class="empty-note">ยังไม่มีร้าน/สาขา — ไปเพิ่มร้านที่ shops.html ก่อน</div>`;
    return;
  }
  content.innerHTML = `
    <div class="card">
      <h2>เลือกสินค้า (เพิ่มได้หลายรายการ)</h2>
      <div class="search-row">
        <input type="text" id="searchBox" placeholder="🔍 ค้นหาชื่อสินค้า หรือรหัส/บาร์โค้ด">
        <div class="scan-btn" id="scanBtn">📷</div>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
    <div id="tagArea"></div>
  `;
  document.getElementById('searchBox').oninput = renderSearchResults;
  document.getElementById('scanBtn').onclick = ()=>{
    openScanner(code=>{
      document.getElementById('searchBox').value = code;
      renderSearchResults();
    });
  };

  const basePath = `shops/${currentBranch.shopId}/branches/${currentBranch.branchId}`;
  db.ref(basePath + '/settings').once('value').then(snap=>{ shopSettings = snap.val() || {}; });
  db.ref(basePath + '/promotions').on('value', snap=>{
    promosCache = snap.val() || {};
    renderTagArea();
  });
  db.ref(basePath + '/products').on('value', snap=>{
    productsCache = snap.val() || {};
    tagQueue = tagQueue.filter(r => productsCache[r.pid]);
    const preselect = localStorage.getItem('pricetagPreselect');
    if(preselect && productsCache[preselect]){
      localStorage.removeItem('pricetagPreselect');
      if(!tagQueue.some(r=>r.pid===preselect)) addToQueue(preselect, true);
    }
    renderSearchResults();
    renderTagArea();
  });
}

function renderSearchResults(){
  const q = (document.getElementById('searchBox').value || '').trim().toLowerCase();
  const wrap = document.getElementById('searchResults');
  if(!q){ wrap.innerHTML = ''; return; }
  const ids = Object.keys(productsCache).filter(id=>{
    const p = productsCache[id];
    return (p.name||'').toLowerCase().includes(q) || (p.barcode||'').toLowerCase().includes(q);
  }).slice(0,8);
  if(ids.length === 0){
    wrap.innerHTML = `<div class="empty-note">ไม่พบสินค้า</div>`;
    return;
  }
  wrap.innerHTML = ids.map(id=>{
    const p = productsCache[id];
    return `<div class="search-item" data-id="${id}"><span>${p.name}</span><span>฿${(p.sellPrice||0).toLocaleString()}</span></div>`;
  }).join('');
  document.querySelectorAll('.search-item').forEach(el=>{
    el.onclick = ()=>{
      addToQueue(el.dataset.id);
      document.getElementById('searchBox').value = '';
      wrap.innerHTML = '';
      renderTagArea();
    };
  });
}

(function(){ const st=document.createElement('style'); st.textContent=TAG_CSS+`
.qrow{background:#0f172a;border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
.qhead{display:flex;justify-content:space-between;margin-bottom:8px;font-family:'Kanit'}

.qcap{font-size:11px;color:var(--sub);margin-bottom:6px}
.qline{display:flex;gap:6px;align-items:center}
.qn{flex:1;min-width:0;font-family:'Kanit';font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qline input{width:58px;margin:0;padding:8px}
.qline select{width:auto;margin:0;padding:8px 6px;font-size:13px}
.qtog{color:var(--sub);cursor:pointer;padding:6px 4px}
.qmore{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.pvcap{font-size:12px;color:#334155;margin-bottom:8px}
#tagPreview{background:#e2e8f0;border-radius:12px;padding:10px;margin-bottom:12px;max-height:420px;overflow:auto}
`; document.head.appendChild(st); })();

function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDT(v){ if(!v) return ''; const d=new Date(v); return isNaN(d)?'':d.toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function fmtD(v){ if(!v) return ''; const d=new Date(v); return isNaN(d)?'':d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}); }

function addToQueue(pid, silent){
  if(tagQueue.some(r=>r.pid===pid)){ const r=tagQueue.find(r=>r.pid===pid); r.qty++; }
  else {
    const promo = getActivePromo(pid);
    const p = productsCache[pid];
    tagQueue.push({ pid, qty:1, mode: promo?'promo':'normal',
      price: promo ? ((p.sellPrice||0)*(1-promo.discountPercent/100)).toFixed(2) : '', from:'', until:'', prodExp:'' });
  }
  previewIdx = Math.max(0, tagQueue.findIndex(r=>r.pid===pid));
  if(!silent){ document.getElementById('searchBox').value=''; document.getElementById('searchResults').innerHTML=''; }
  renderTagArea();
}

function rowPrice(r){
  const p = productsCache[r.pid]; const orig = p.sellPrice||0; const v = parseFloat(r.price)||0;
  return { orig, price: (v>0 && v<orig) ? v : orig, disc: v>0 && v<orig };
}
function renderSvgs(root){
  root.querySelectorAll('svg.bcsvg').forEach(el=>{
    try{ JsBarcode(el, el.dataset.code, { format:"CODE128", displayValue:true, fontSize:parseInt(el.dataset.fs)||10, height:parseInt(el.dataset.h)||30, margin:parseInt(el.dataset.m)||2, width:parseFloat(el.dataset.w)||1.4 }); }catch(e){}
  });
}
function tagHTML(r, layout){
  const p = productsCache[r.pid];
  const shopName = shopSettings.shopName || (shopsCache[currentBranch.shopId]||{}).info?.name || 'ร้านค้า';
  const pr = rowPrice(r);
  const banner = r.mode==='clear' ? `<div class="banner">เคลียร์สินค้า · ใกล้หมดอายุ</div>` : r.mode==='promo' ? `<div class="banner promo">โปรโมชั่น</div>` : '';
  let dates = '';
  if(r.mode!=='normal'){
    if(r.from) dates += `เริ่ม ${fmtDT(r.from)}<br>`;
    if(r.until) dates += `ป้ายหมดอายุ ${fmtDT(r.until)}<br>`;
    if(r.mode==='clear' && r.prodExp) dates += `สินค้าหมดอายุ ${fmtD(r.prodExp)}`;
  }
  const bc = p.barcode ? `<svg class="bcsvg" data-code="${esc(p.barcode)}" data-h="${layout==='landscape'?40:30}"></svg>` : `<div class="nobc">ยังไม่มีบาร์โค้ด</div>`;
  const prow = `<div class="prow">${pr.disc?`<span class="orig">฿${pr.orig.toLocaleString()}</span>`:''}<span class="price">฿${pr.price.toLocaleString()}</span></div>`;
  const dl = dates?`<div class="dates">${dates}</div>`:'';
  const main = `<div class="shop">${esc(shopName)}</div><div class="name">${esc(p.name)}</div>${prow}${dl}`;
  if(layout==='landscape') return `<div class="pt land">${banner}<div class="ltop"><div class="lname"><div class="shop">${esc(shopName)}</div><div class="name">${esc(p.name)}</div>${dl}</div><div class="lprice">${prow}</div></div><div class="lbc">${bc}</div></div>`;
  return `<div class="pt">${banner}${main}${bc}</div>`;
}
function allTagsHTML(){
  const layout = document.getElementById('tagLayout').value;
  let out=''; tagQueue.forEach(r=>{ const n=Math.max(1,parseInt(r.qty)||1); const h=tagHTML(r,layout); for(let k=0;k<n;k++) out+=h; });
  return out;
}

function renderTagArea(){
  const area = document.getElementById('tagArea');
  if(!area) return;
  if(!tagQueue.length){ area.innerHTML = `<div class="empty-note">ค้นหาแล้วเลือกสินค้า (เลือกได้หลายรายการ) เพื่อสร้างป้ายราคา/บาร์โค้ด</div>`; return; }
  const prevLayout = (document.getElementById('tagLayout')||{}).value || 'portrait';
  area.innerHTML = `
    <div class="card">
      <h2>รายการป้าย (${tagQueue.length} สินค้า)</h2>
      <label>รูปแบบป้าย</label>
      <select id="tagLayout"><option value="portrait">แนวตั้ง</option><option value="landscape">แนวนอน</option></select>
      <div id="queueList"></div>
      <div class="msg" id="tagMsg"></div>
      <h2>ตัวอย่างป้าย</h2>
      <div id="tagPreview"></div>
      <button class="btn" id="printTagBtn">🖨️ พิมพ์ป้ายทั้งหมด</button>
      <button class="btn outline" id="printBcBtn">🖨️ พิมพ์เฉพาะบาร์โค้ด</button>
      <button class="btn outline" id="genMissingBtn">🔄 สร้างบาร์โค้ดให้สินค้าที่ยังไม่มี</button>
      <button class="btn outline" id="clearQueueBtn">ล้างรายการทั้งหมด</button>
    </div>`;
  const lay = document.getElementById('tagLayout'); lay.value = prevLayout; lay.onchange = renderPreview;
  renderQueue(); renderPreview();
  document.getElementById('printTagBtn').onclick = ()=> openPrint(allTagsHTML());
  document.getElementById('printBcBtn').onclick = printBarcodes;
  document.getElementById('genMissingBtn').onclick = generateMissingBarcodes;
  document.getElementById('clearQueueBtn').onclick = ()=>{ tagQueue=[]; renderTagArea(); };
}

function renderQueue(){
  const wrap = document.getElementById('queueList');
  wrap.innerHTML = `<div class="qcap">สินค้า · จำนวนป้าย · ประเภท (กด ▼ เพื่อตั้งราคา/วันที่)</div>` + tagQueue.map((r,i)=>{
    const p = productsCache[r.pid];
    return `<div class="qrow ${i===previewIdx?'sel':''}" data-row="${i}">
      <div class="qline">
        <div class="qn">${esc(p.name)}${p.barcode?'':' ⚠️'}</div>
        <input type="number" min="1" value="${r.qty}" data-i="${i}" data-f="qty">
        <select data-i="${i}" data-f="mode">
          <option value="normal" ${r.mode==='normal'?'selected':''}>ปกติ</option>
          <option value="promo" ${r.mode==='promo'?'selected':''}>โปร</option>
          <option value="clear" ${r.mode==='clear'?'selected':''}>เคลียร์</option></select>
        <span class="qtog" data-tog="${i}">${r.open?'▲':'▼'}</span>
        <span class="qdel" data-del="${i}">✕</span>
      </div>
      ${r.open?`<div class="qmore">
        ${p.barcode?'':`<div class="qwarn">⚠️ ยังไม่มีบาร์โค้ด — กด "สร้างบาร์โค้ด" ด้านล่างก่อนพิมพ์</div>`}
        <label>ราคาบนป้าย (ว่าง = ราคาปกติ ฿${(p.sellPrice||0).toLocaleString()})</label>
        <input type="number" value="${esc(r.price)}" data-i="${i}" data-f="price" placeholder="เช่น ราคาโปรโมชั่น" style="width:100%">
        ${r.mode!=='normal'?`<div class="row2">
          <div><label>เริ่มวัน-เวลา</label><input type="datetime-local" value="${esc(r.from)}" data-i="${i}" data-f="from" style="width:100%"></div>
          <div><label>ป้ายหมดอายุ</label><input type="datetime-local" value="${esc(r.until)}" data-i="${i}" data-f="until" style="width:100%"></div></div>`:''}
        ${r.mode==='clear'?`<label>วันหมดอายุของสินค้า</label><input type="date" value="${esc(r.prodExp)}" data-i="${i}" data-f="prodExp" style="width:100%">`:''}
      </div>`:''}
    </div>`;
  }).join('');
  const setPv = i=>{ if(i===previewIdx) return; previewIdx=i; wrap.querySelectorAll('.qrow').forEach((el,k)=>el.classList.toggle('sel',k===i)); renderPreview(); };
  wrap.onfocusin = e=>{ const row=e.target.closest('.qrow'); if(row) setPv(parseInt(row.dataset.row)); };
  wrap.oninput = e=>{ const t=e.target; if(t.dataset.f && t.tagName!=='SELECT'){ tagQueue[t.dataset.i][t.dataset.f]=t.value; previewIdx=parseInt(t.dataset.i); renderPreview(); } };
  wrap.onchange = e=>{ const t=e.target; if(t.tagName==='SELECT'){ const r=tagQueue[t.dataset.i]; r.mode=t.value; if(r.mode!=='normal') r.open=true; previewIdx=parseInt(t.dataset.i); renderQueue(); renderPreview(); } };
  wrap.onclick = e=>{
    const d=e.target.dataset.del, g=e.target.dataset.tog;
    if(d!==undefined){ tagQueue.splice(parseInt(d),1); previewIdx=0; renderTagArea(); }
    else if(g!==undefined){ const r=tagQueue[parseInt(g)]; r.open=!r.open; previewIdx=parseInt(g); renderQueue(); renderPreview(); }
  };
}
function renderPreview(){
  const layout = document.getElementById('tagLayout').value;
  const pv = document.getElementById('tagPreview');
  if(!tagQueue.length){ pv.innerHTML=''; return; }
  const idx = Math.min(previewIdx, tagQueue.length-1);
  const r = tagQueue[idx];
  const total = tagQueue.reduce((a,x)=>a+Math.max(1,parseInt(x.qty)||1),0);
  pv.innerHTML = `<div class="pvcap">ตัวอย่าง: ${esc(productsCache[r.pid].name)} · พิมพ์ทั้งหมด ${total} ป้าย (${tagQueue.length} สินค้า)</div><div class="grid">${tagHTML(r,layout)}</div>`;
  renderSvgs(pv);
}

function generateMissingBarcodes(){
  const base = `shops/${currentBranch.shopId}/branches/${currentBranch.branchId}/products/`;
  const missing = tagQueue.filter(r=>!productsCache[r.pid].barcode);
  if(!missing.length){ document.getElementById('tagMsg').className='msg ok'; document.getElementById('tagMsg').textContent='ทุกสินค้ามีบาร์โค้ดแล้ว'; return; }
  const seed = Date.now();
  Promise.all(missing.map((r,k)=>{
    const code = '2' + String(seed + k).slice(-11);
    productsCache[r.pid].barcode = code;
    return db.ref(base + r.pid + '/barcode').set(code);
  })).then(()=>{ renderTagArea(); const m=document.getElementById('tagMsg'); m.className='msg ok'; m.textContent=`สร้างบาร์โค้ดให้ ${missing.length} สินค้าแล้ว`; })
    .catch(()=>{ const m=document.getElementById('tagMsg'); m.className='msg error'; m.textContent='บันทึกบาร์โค้ดไม่สำเร็จ ลองใหม่อีกครั้ง'; });
}

function printBarcodes(){
  let out='';
  tagQueue.forEach(r=>{
    const p = productsCache[r.pid]; if(!p.barcode) return;
    const n = Math.max(1, parseInt(r.qty)||1);
    for(let k=0;k<n;k++) out += `<div class="bcstrip"><div style="font-size:10px">${esc(p.name)}</div><svg class="bcsvg" data-code="${esc(p.barcode)}" data-h="50" data-fs="14" data-m="6" data-w="2"></svg></div>`;
  });
  if(!out){ alert('ไม่มีสินค้าที่มีบาร์โค้ด กรุณาสร้างบาร์โค้ดก่อน'); return; }
  openPrint(out);
}

function openPrint(body){
  if(!body) return;
  const area = document.getElementById('printArea');
  area.innerHTML = `<div class="grid">${body}</div>`;
  renderSvgs(area);
  setTimeout(()=> window.print(), 300);
}
</script>
