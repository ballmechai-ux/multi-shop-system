<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ระบบร้านค้า - Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#060b16;--panel:#0d1526;--panel2:#111d33;--border:#1c2b45;--teal:#22d3ee;--gold:#fbbf24;--text:#e8edf5;--sub:#7c8aa5;--danger:#f87171;--ok:#4ade80}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:radial-gradient(circle at 15% 0%,#0e2a3a55,transparent 45%),radial-gradient(circle at 90% 10%,#3a2e0e55,transparent 40%),var(--bg);min-height:100vh;color:var(--text);padding:14px;padding-bottom:50px}
button,input,select{font:inherit}.wrap{max-width:600px;margin:0 auto}
.navbar{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--gold));display:flex;align-items:center;justify-content:center}
.t1{font-family:Kanit;font-size:14.5px}.t2{font-size:10.5px;color:var(--sub)}.who{text-align:right;font-size:11px;color:var(--sub)}.who .name{font-family:Kanit;color:var(--text);font-size:13px}.badge{display:inline-block;margin-top:2px;font-size:9.5px;padding:1px 8px;border-radius:20px;background:#22d3ee33;color:var(--teal);font-family:Kanit}
.shop-select{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}.shop-select::-webkit-scrollbar{display:none}
.shop-chip{flex:0 0 auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 14px;font-size:12.5px;color:var(--sub);cursor:pointer;white-space:nowrap}.shop-chip.active{border-color:var(--teal);color:var(--teal);background:#22d3ee33}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.kpi{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;position:relative;overflow:hidden}.icon{font-size:18px}.label{font-size:11.5px;color:var(--sub);margin-top:6px}.value{font-family:Kanit;font-size:21px;margin-top:2px}.accent-teal .value{color:var(--teal)}.accent-gold .value{color:var(--gold)}.accent-danger .value{color:var(--danger)}.wide{grid-column:span 2;display:flex;align-items:center;justify-content:space-between}.wide .value{font-size:16px}
.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.qa-btn{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 4px;text-align:center;cursor:pointer;font-size:11px;color:var(--text)}.qa-btn .qi{font-size:19px;display:block;margin-bottom:4px}.qa-btn:active{border-color:var(--teal)}
.charts-row{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.panel-head h3{font-family:Kanit;font-size:14.5px}.sub{font-size:11px;color:var(--sub)}.chart-box{height:180px;position:relative}
.empty-note{text-align:center;color:var(--sub);font-size:12px;padding:8px 0}.footer-link{text-align:center;font-size:12px;margin-top:8px}.footer-link a{color:var(--teal);text-decoration:none}
.action{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 12px;cursor:pointer}.action.primary{background:#22d3ee18;border-color:#22d3ee66;color:var(--teal)}.action.danger{color:var(--danger);border-color:#f8717166}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.module-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:space-between}.module-card .mname{font-family:Kanit}.switch{position:relative;width:46px;height:26px}.switch input{display:none}.slider{position:absolute;inset:0;background:#26344e;border-radius:30px;cursor:pointer}.slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#0e9fb6}.switch input:checked+.slider:before{transform:translateX(20px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.row-main{min-width:0}.row-title{font-family:Kanit}.row-sub{font-size:11px;color:var(--sub);margin-top:2px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--sub)}.field input,.field select{width:100%;padding:11px;border-radius:11px;border:1px solid var(--border);background:#081122;color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:var(--teal)}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:50;padding:10px}.modal.show{display:flex}.modal-box{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{font-family:Kanit;font-size:18px}.close{background:none;border:0;color:var(--sub);font-size:25px;cursor:pointer}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;border:1px solid var(--border);background:var(--panel2);color:var(--sub);border-radius:10px;padding:8px 12px;cursor:pointer}.tab.active{color:var(--teal);border-color:var(--teal);background:#22d3ee18}
.notice{padding:10px 12px;border-radius:12px;background:#fbbf2412;border:1px solid #fbbf2444;color:#fcd34d;font-size:12px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#15233b;border:1px solid var(--border);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:100;font-size:12px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.blocked{text-align:center;padding:60px 20px;color:var(--sub)}.blocked h1{font-family:Kanit;color:var(--text);font-size:20px;margin-bottom:10px}
@media(min-width:900px){body{padding:28px}.wrap{max-width:1180px}.navbar{padding:18px 26px;border-radius:20px}.shop-select{flex-direction:row}.shop-chip{padding:10px 20px}.quick-actions{gap:12px}.qa-btn{padding:18px 8px;font-size:12.5px}.qa-btn .qi{font-size:24px}.kpi-grid{grid-template-columns:repeat(4,1fr);gap:14px}.kpi{padding:18px 20px;border-radius:18px}.kpi .value{font-size:25px}.wide{grid-column:span 2}.charts-row{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.panel{margin-bottom:0;padding:22px}.chart-box{height:260px}.modal{align-items:center}}
</style>
</head>
<body>
<div id="app"><div class="blocked">กำลังโหลด...</div></div>
<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast"></div>

<script>
const firebaseConfig={
 apiKey:"AIzaSyDmWjzmkCTjih7G1smod3-B8pR5OMxxud0",
 authDomain:"multi-shop-system.firebaseapp.com",
 databaseURL:"https://multi-shop-system-default-rtdb.asia-southeast1.firebasedatabase.app/",
 projectId:"multi-shop-system",
 storageBucket:"multi-shop-system.firebasestorage.app",
 messagingSenderId:"99369473058",
 appId:"1:99369473058:web:07bd5fbc308f79f18ee67b"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database(),app=document.getElementById("app"),modal=document.getElementById("modal"),modalBox=document.getElementById("modalBox");
let session=null,shopsCache={},branchOptions=[],currentBranch=null,salesChart=null,invChart=null;

try{session=JSON.parse(localStorage.getItem("shopSession")||"null")}catch(e){}
if(!session){
 app.innerHTML='<div class="blocked"><h1>ยังไม่ได้เข้าสู่ระบบ</h1><br><a href="login.html" style="color:#22d3ee">ไปหน้าเข้าสู่ระบบ</a></div>';
}else boot();

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function isAdmin(){return session.role==="admin"}
function canManage(){return session.role==="admin"||session.role==="owner"}

function boot(){
 db.ref("shops").on("value",s=>{shopsCache=s.val()||{};buildBranchOptions();renderShell()});
}
function buildBranchOptions(){
 branchOptions=[];
 Object.keys(shopsCache).forEach(shopId=>{
  const shop=shopsCache[shopId]||{},info=shop.info||{},branches=shop.branches||{};
  let ids=Object.keys(branches);
  if(session.role!=="admin"){
   const access=session.access||{};
   if(!access[shopId])return;
   ids=ids.filter(b=>access[shopId][b]);
  }
  ids.forEach(bid=>branchOptions.push({shopId,shopName:info.name||"ร้านไม่มีชื่อ",shopType:info.type||"ร้านค้า",branchId:bid,branchName:branches[bid]?.name||"สาขา"}));
 });
 if(currentBranch&&!branchOptions.some(x=>x.shopId===currentBranch.shopId&&x.branchId===currentBranch.branchId))currentBranch=null;
 if(!currentBranch&&branchOptions.length){currentBranch={shopId:branchOptions[0].shopId,branchId:branchOptions[0].branchId};session.currentShopId=currentBranch.shopId;session.currentBranchId=currentBranch.branchId;localStorage.setItem('shopSession',JSON.stringify(session));}
}
function renderShell(){
 const roleLabel={admin:"ADMIN",owner:"OWNER",manager:"MANAGER",staff:"STAFF"}[session.role]||session.role;
 app.innerHTML=`<div class="wrap">
 <div class="navbar"><div class="brand"><div class="logo">🏮</div><div><div class="t1">ระบบร้านค้า</div><div class="t2">Multi-Shop Dashboard</div></div></div>
 <div class="who"><div class="name">${esc(session.name||"ผู้ใช้งาน")}</div><span class="badge">${esc(roleLabel)}</span></div></div>
 <div class="shop-select" id="shopSelect"></div>
 <div id="dashContent"></div>
 <div class="footer-link"><a href="login.html">← ออกจากระบบ / สลับบัญชี</a></div></div>`;
 renderShopSelect();renderDashboardContent();
}
function renderShopSelect(){
 const w=document.getElementById("shopSelect");
 if(!branchOptions.length){w.innerHTML='<div class="empty-note">ยังไม่มีร้าน/สาขาที่เข้าถึงได้</div>';return}
 w.innerHTML=branchOptions.map(b=>{let a=currentBranch?.shopId===b.shopId&&currentBranch?.branchId===b.branchId;
 return `<div class="shop-chip ${a?"active":""}" data-shop="${esc(b.shopId)}" data-branch="${esc(b.branchId)}">${esc(b.shopName)} · ${esc(b.branchName)}</div>`}).join("");
 w.querySelectorAll(".shop-chip").forEach(e=>e.onclick=()=>{currentBranch={shopId:e.dataset.shop,branchId:e.dataset.branch};session.currentShopId=currentBranch.shopId;session.currentBranchId=currentBranch.branchId;localStorage.setItem('shopSession',JSON.stringify(session));renderShopSelect();renderDashboardContent()});
}
function renderDashboardContent(){
 const c=document.getElementById("dashContent");
 if(!currentBranch){c.innerHTML='<div class="panel"><div class="empty-note">ยังไม่มีร้าน/สาขาให้แสดงข้อมูล</div></div>';return}
 const shop=shopsCache[currentBranch.shopId]||{},modules=shop.modules||{pos:true,drinks:false,food:false};
 let quick=[];
 if(modules.pos!==false)quick.push(["🛒","ขายสินค้า","sell"]);
 if(modules.drinks)quick.push(["🥤","ร้านน้ำปั่น","drinks"]);
 if(modules.food)quick.push(["🍳","อาหารตามสั่ง","food"]);
 quick.push(["📦","สต็อก","stock"]);
 if(quick.length<6)quick.push(["📒","ลูกหนี้","debt"]);
 quick=quick.slice(0,8);
 c.innerHTML=`<div class="kpi-grid">
 <div class="kpi accent-teal"><div class="icon">💰</div><div class="label">ยอดขายวันนี้</div><div class="value" id="todaySales">฿0</div></div>
 <div class="kpi accent-teal"><div class="icon">🧾</div><div class="label">จำนวนบิลวันนี้</div><div class="value" id="todayBills">0</div></div>
 <div class="kpi accent-gold"><div class="icon">📈</div><div class="label">กำไรวันนี้</div><div class="value" id="todayProfit">฿0</div></div>
 <div class="kpi accent-danger"><div class="icon">👤</div><div class="label">ยอดลูกหนี้</div><div class="value" id="debtTotal">฿0</div></div>
 <div class="kpi wide"><div><div class="icon">📦</div><div class="label">สินค้าใกล้หมด / หมด</div></div><div class="value" id="stockAlert">0 / 0</div></div>
 <div class="kpi wide"><div><div class="icon">🏆</div><div class="label">สินค้าขายดีวันนี้</div></div><div class="value" id="bestSellerVal">-</div></div></div>
 <div class="quick-actions" id="quickActions">${quick.map(q=>`<div class="qa-btn" data-target="${q[2]}"><span class="qi">${q[0]}</span>${q[1]}</div>`).join("")}${canManage()?'<div class="qa-btn" data-target="manage"><span class="qi">⚙️</span>จัดการร้าน</div>':""}</div>
 <div class="charts-row"><div class="panel"><div class="panel-head"><h3>📈 ยอดขาย 7 วันล่าสุด</h3><span class="sub">บาท</span></div><div class="chart-box"><canvas id="salesCanvas"></canvas></div></div>
 <div class="panel"><div class="panel-head"><h3>📦 จำนวนสินค้าคงเหลือ</h3><span class="sub">ชิ้น</span></div><div class="chart-box"><canvas id="invCanvas"></canvas></div><div class="empty-note" id="invEmptyNote" style="display:none">ยังไม่มีข้อมูลสินค้า</div></div></div>`;
 document.querySelectorAll(".qa-btn").forEach(b=>b.onclick=()=>quickAction(b.dataset.target));
 loadStatsAndCharts();
}
function quickAction(target){
 const map={sell:"sell.html",stock:"stock.html",debt:"debt.html",drinks:"drinks.html",food:"food.html"};
 if(target==="manage"){openManagement();return}
 if(map[target])location.href=map[target];else toast("หน้านี้ยังไม่ถูกสร้าง");
}
function loadStatsAndCharts(){
 if(!currentBranch)return;
 const base=`shops/${currentBranch.shopId}/branches/${currentBranch.branchId}`,labels=[],data=[],today=new Date();
 for(let i=6;i>=0;i--){let d=new Date(today);d.setDate(d.getDate()-i);labels.push(d.toLocaleDateString("th-TH",{day:"numeric",month:"short"}));data.push(0)}
 db.ref(base+"/bills").once("value").then(s=>{
  Object.values(s.val()||{}).forEach(b=>{if(!b.date)return;let d=new Date(b.date),diff=Math.floor((today-d)/86400000);if(diff>=0&&diff<7)data[6-diff]+=Number(b.total)||0});
  const todayKey=today.toDateString();let total=0,count=0;
  Object.values(s.val()||{}).forEach(b=>{if(b.date&&new Date(b.date).toDateString()===todayKey){total+=Number(b.total)||0;count++}});
  document.getElementById("todaySales").textContent="฿"+total.toLocaleString();
  document.getElementById("todayBills").textContent=count;
  renderSalesChart(labels,data);
 }).catch(()=>renderSalesChart(labels,data));
 db.ref(base+"/products").once("value").then(s=>{
  const p=s.val()||{},cats={},near=[],out=[];
  Object.values(p).forEach(x=>{let cat=x.category||"ไม่ระบุหมวด";cats[cat]=(cats[cat]||0)+(Number(x.stock)||0);if(Number(x.stock)<=0)out.push(x);else if(x.minStock!=null&&Number(x.stock)<=Number(x.minStock))near.push(x)});
  document.getElementById("stockAlert").textContent=near.length+" / "+out.length;
  const labs=Object.keys(cats);document.getElementById("invEmptyNote").style.display=labs.length?"none":"block";renderInvChart(labs.length?labs:["ยังไม่มีข้อมูล"],labs.length?Object.values(cats):[0]);
 }).catch(()=>renderInvChart(["ยังไม่มีข้อมูล"],[0]));
}
function renderSalesChart(labels,data){const ctx=document.getElementById("salesCanvas");if(salesChart)salesChart.destroy();salesChart=new Chart(ctx,{type:"line",data:{labels,datasets:[{data,borderColor:"#22d3ee",backgroundColor:"#22d3ee22",fill:true,tension:.35,pointRadius:3,pointBackgroundColor:"#22d3ee"}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#7c8aa5",font:{family:"Sarabun",size:10}},grid:{color:"#1c2b45"}},y:{ticks:{color:"#7c8aa5",font:{family:"Sarabun",size:10}},grid:{color:"#1c2b45"}}}}})}
function renderInvChart(labels,data){const ctx=document.getElementById("invCanvas");if(invChart)invChart.destroy();invChart=new Chart(ctx,{type:"bar",data:{labels,datasets:[{data,backgroundColor:"#fbbf24aa",borderRadius:6,borderColor:"#fbbf24",borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#7c8aa5",font:{family:"Sarabun",size:10}},grid:{display:false}},y:{ticks:{color:"#7c8aa5",font:{family:"Sarabun",size:10}},grid:{color:"#1c2b45"}}}}})}

/* ---------------- Management Center ---------------- */
let manageTab="shop";
function openManagement(tab="shop"){manageTab=tab;renderManagement()}
function closeModal(){modal.classList.remove("show");modalBox.innerHTML=""}
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});

function renderManagement(){
 if(!canManage()){toast("ไม่มีสิทธิ์จัดการร้าน");return}
 modal.classList.add("show");
 const shop=shopsCache[currentBranch.shopId]||{},info=shop.info||{},modules=shop.modules||{pos:true,drinks:false,food:false};
 modalBox.innerHTML=`<div class="modal-head"><h2>⚙️ ศูนย์จัดการร้าน</h2><button class="close" onclick="closeModal()">×</button></div>
 <div class="tabs">
  <button class="tab ${manageTab==="shop"?"active":""}" onclick="manageTab='shop';renderManagement()">🏪 ข้อมูลร้าน</button>
  <button class="tab ${manageTab==="branch"?"active":""}" onclick="manageTab='branch';renderManagement()">🏢 สาขา</button>
  <button class="tab ${manageTab==="module"?"active":""}" onclick="manageTab='module';renderManagement()">🧩 โมดูล</button>
  <button class="tab ${manageTab==="users"?"active":""}" onclick="manageTab='users';renderManagement()">👥 ผู้ใช้งาน</button>
  <button class="tab ${manageTab==="perm"?"active":""}" onclick="manageTab='perm';renderManagement()">🔐 สิทธิ์</button>
 </div><div id="manageBody"></div>`;
 if(manageTab==="shop")renderShopManager();
 if(manageTab==="branch")renderBranchManager();
 if(manageTab==="module")renderModuleManager();
 if(manageTab==="users")renderUsersManager();
 if(manageTab==="perm")renderPermissionManager();
}
function renderShopManager(){
 const shop=shopsCache[currentBranch.shopId]||{},i=shop.info||{};
 document.getElementById("manageBody").innerHTML=`<div class="notice">ข้อมูลส่วนนี้เป็นข้อมูลของร้านที่กำลังเลือกอยู่ ไม่ใช่ร้านอื่น</div>
 <div class="form-grid"><div class="field full"><label>ชื่อร้าน</label><input id="shopName" value="${esc(i.name||"")}"></div>
 <div class="field"><label>ประเภทร้าน</label><input id="shopType" value="${esc(i.type||"")}"></div><div class="field"><label>สถานะ</label><select id="shopStatus"><option value="active" ${i.status!=="inactive"?"selected":""}>เปิดใช้งาน</option><option value="inactive" ${i.status==="inactive"?"selected":""}>ปิดใช้งาน</option></select></div>
 <div class="field full"><label>ที่อยู่</label><input id="shopAddress" value="${esc(i.address||"")}"></div><div class="field"><label>โทรศัพท์</label><input id="shopPhone" value="${esc(i.phone||"")}"></div></div>
 <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="action primary" onclick="saveShopInfo()">💾 บันทึกข้อมูลร้าน</button></div>`;
}
function saveShopInfo(){
 const id=currentBranch.shopId;
 db.ref("shops/"+id+"/info").update({name:document.getElementById("shopName").value.trim(),type:document.getElementById("shopType").value.trim(),status:document.getElementById("shopStatus").value,address:document.getElementById("shopAddress").value.trim(),phone:document.getElementById("shopPhone").value.trim()}).then(()=>{toast("บันทึกข้อมูลร้านแล้ว");closeModal()}).catch(e=>toast("บันทึกไม่สำเร็จ: "+e.message));
}
function renderBranchManager(){
 const branches=(shopsCache[currentBranch.shopId]?.branches)||{};
 document.getElementById("manageBody").innerHTML=`<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="action primary" onclick="showBranchForm()">＋ เพิ่มสาขา</button></div><div>${Object.entries(branches).map(([id,b])=>`<div class="row"><div class="row-main"><div class="row-title">🏢 ${esc(b.name||"ไม่ระบุ")}</div><div class="row-sub">รหัส: ${esc(id)} · ${b.status==="inactive"?"ปิด":"เปิด"}</div></div><div class="actions"><button class="action" onclick="showBranchForm('${esc(id)}')">แก้ไข</button><button class="action danger" onclick="deleteBranch('${esc(id)}')">ลบ</button></div></div>`).join("")||'<div class="empty-note">ยังไม่มีสาขา</div>'}</div>`;
}
function showBranchForm(id=""){
 const b=(shopsCache[currentBranch.shopId]?.branches||{})[id]||{};
 modalBox.innerHTML=`<div class="modal-head"><h2>${id?"แก้ไข":"เพิ่ม"}สาขา</h2><button class="close" onclick="renderManagement()">×</button></div>
 <div class="form-grid"><div class="field"><label>รหัสสาขา</label><input id="bid" value="${esc(id)}" ${id?"readonly":""}></div><div class="field"><label>ชื่อสาขา</label><input id="bname" value="${esc(b.name||"")}"></div>
 <div class="field"><label>สถานะ</label><select id="bstatus"><option value="active" ${b.status!=="inactive"?"selected":""}>เปิด</option><option value="inactive" ${b.status==="inactive"?"selected":""}>ปิด</option></select></div>
 <div class="field full"><label>ที่อยู่</label><input id="baddress" value="${esc(b.address||"")}"></div></div>
 <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="action" onclick="renderManagement()">ยกเลิก</button><button class="action primary" onclick="saveBranch('${esc(id)}')">💾 บันทึก</button></div>`;
}
function saveBranch(oldId){
 const id=document.getElementById("bid").value.trim(),name=document.getElementById("bname").value.trim();
 if(!id||!name)return toast("กรุณากรอกรหัสและชื่อสาขา");
 const path="shops/"+currentBranch.shopId+"/branches/";
 const val={name,status:document.getElementById("bstatus").value,address:document.getElementById("baddress").value.trim()};
 if(oldId&&oldId!==id){db.ref(path+oldId).remove().then(()=>db.ref(path+id).set(val)).then(()=>{toast("แก้ไขสาขาแล้ว");currentBranch.branchId=id;renderManagement()})}
 else db.ref(path+id).set(val).then(()=>{toast("บันทึกสาขาแล้ว");renderManagement()}).catch(e=>toast("บันทึกไม่สำเร็จ: "+e.message));
}
function deleteBranch(id){
 if(!confirm("ลบสาขานี้หรือไม่? ข้อมูลขาย/สต็อกใต้สาขาอาจยังคงอยู่"))return;
 db.ref("shops/"+currentBranch.shopId+"/branches/"+id).remove().then(()=>{toast("ลบสาขาแล้ว");buildBranchOptions();renderManagement()}).catch(e=>toast("ลบไม่สำเร็จ: "+e.message));
}
function renderModuleManager(){
 const s=shopsCache[currentBranch.shopId]||{},m=s.modules||{pos:true,drinks:false,food:false,stock:true,debt:true};
 const list=[["pos","🛒 ร้านขายสินค้า","POS และการขาย"],["drinks","🥤 ร้านน้ำปั่น","เมนู สูตร ออเดอร์ คิว"],["food","🍳 อาหารตามสั่ง","เมนู สูตร ออเดอร์ ครัว"],["stock","📦 สต็อก","สินค้าและวัตถุดิบ"],["debt","📒 ลูกหนี้","ลูกค้าและหนี้"]];
 document.getElementById("manageBody").innerHTML=`<div class="notice">เปิดเฉพาะโมดูลที่ร้านนี้ต้องการ ลูกค้าจะเห็นเฉพาะโมดูลที่เปิดและมีสิทธิ์</div><div class="admin-grid">${list.map(x=>`<div class="module-card"><div><div class="mname">${x[1]}</div><div class="row-sub">${x[2]}</div></div><label class="switch"><input type="checkbox" ${m[x[0]]!==false?"checked":""} onchange="toggleModule('${x[0]}',this.checked)"><span class="slider"></span></label></div>`).join("")}</div>`;
}
function toggleModule(key,val){db.ref("shops/"+currentBranch.shopId+"/modules/"+key).set(val).then(()=>{toast(val?"เปิดโมดูลแล้ว":"ปิดโมดูลแล้ว");renderManagement()}).catch(e=>toast("บันทึกไม่สำเร็จ: "+e.message))}
function renderUsersManager(){
 const users=shopsCache[currentBranch.shopId]?.users||{};
 document.getElementById("manageBody").innerHTML=`<div class="notice">ผู้ใช้ถูกผูกกับร้านนี้ และกำหนดสาขา/โมดูลในสิทธิ์ได้ภายหลัง</div>
 <div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="action primary" onclick="showUserForm()">＋ เพิ่มผู้ใช้งาน</button></div>
 ${Object.entries(users).map(([id,u])=>`<div class="row"><div class="row-main"><div class="row-title">👤 ${esc(u.name||"ไม่ระบุ")}</div><div class="row-sub">${esc(u.username||id)} · ${esc(u.role||"staff")}</div></div><div class="actions"><button class="action" onclick="showUserForm('${esc(id)}')">แก้ไข</button><button class="action danger" onclick="deleteUser('${esc(id)}')">ลบ</button></div></div>`).join("")||'<div class="empty-note">ยังไม่มีผู้ใช้ในร้านนี้</div>'}`;
}
function showUserForm(id=""){
 const u=shopsCache[currentBranch.shopId]?.users?.[id]||{};
 modalBox.innerHTML=`<div class="modal-head"><h2>${id?"แก้ไข":"เพิ่ม"}ผู้ใช้งาน</h2><button class="close" onclick="renderManagement()">×</button></div>
 <div class="form-grid"><div class="field full"><label>ชื่อ</label><input id="uname" value="${esc(u.name||"")}"></div><div class="field"><label>Username</label><input id="uuser" value="${esc(u.username||"")}"></div><div class="field"><label>รหัสผ่าน/PIN</label><input id="upass" value="${esc(u.password||"")}"></div><div class="field"><label>บทบาท</label><select id="urole"><option value="owner" ${u.role==="owner"?"selected":""}>เจ้าของ</option><option value="manager" ${u.role==="manager"?"selected":""}>ผู้จัดการ</option><option value="staff" ${!u.role||u.role==="staff"?"selected":""}>พนักงาน</option></select></div></div>
 <div class="notice" style="margin-top:12px">ตัวอย่างนี้เก็บข้อมูลผู้ใช้ใน Realtime Database ตามโครงสร้างระบบเดิม ควรย้ายการยืนยันตัวตนไป Firebase Authentication ก่อนใช้งานจริง</div>
 <div style="display:flex;justify-content:flex-end;gap:8px"><button class="action" onclick="renderManagement()">ยกเลิก</button><button class="action primary" onclick="saveUser('${esc(id)}')">💾 บันทึก</button></div>`;
}
function saveUser(oldId){
 const id=oldId||("U"+Date.now()),name=document.getElementById("uname").value.trim(),username=document.getElementById("uuser").value.trim(),password=document.getElementById("upass").value,role=document.getElementById("urole").value;
 if(!name||!username)return toast("กรุณากรอกชื่อและ Username");
 db.ref("shops/"+currentBranch.shopId+"/users/"+id).update({name,username,password,role}).then(()=>{toast("บันทึกผู้ใช้แล้ว");renderManagement()}).catch(e=>toast("บันทึกไม่สำเร็จ: "+e.message));
}
function deleteUser(id){if(!confirm("ลบผู้ใช้งานนี้หรือไม่?"))return;db.ref("shops/"+currentBranch.shopId+"/users/"+id).remove().then(()=>{toast("ลบผู้ใช้แล้ว");renderManagement()}).catch(e=>toast("ลบไม่สำเร็จ: "+e.message))}
function renderPermissionManager(){
 const s=shopsCache[currentBranch.shopId]||{},users=s.users||{},branches=s.branches||{},modules=s.modules||{};
 document.getElementById("manageBody").innerHTML=`<div class="notice">กำหนดสิทธิ์การเข้าถึงระดับผู้ใช้: สาขา + โมดูล ตัวอย่างนี้จะเก็บไว้ที่ shops/{shopId}/users/{userId}/access</div>
 ${Object.entries(users).map(([id,u])=>`<div class="panel" style="margin-bottom:10px"><div class="panel-head"><h3>👤 ${esc(u.name||id)}</h3><span class="sub">${esc(u.role||"staff")}</span></div>
 <div class="row"><div class="row-main"><div class="row-title">สาขาที่เข้าถึง</div><div class="row-sub">ติ๊กเพื่ออนุญาต</div></div></div>
 ${Object.entries(branches).map(([bid,b])=>`<label class="row" style="cursor:pointer"><div class="row-main"><div class="row-title">🏢 ${esc(b.name||bid)}</div><div class="row-sub">${esc(bid)}</div></div><input type="checkbox" ${u.access?.branches?.[bid]!==false&&u.access?.branches?.[bid]?"checked":""} onchange="setUserAccess('${esc(id)}','branches/${esc(bid)}',this.checked)"></label>`).join("")}
 <div class="row"><div class="row-main"><div class="row-title">โมดูล</div><div class="row-sub">สิทธิ์เมนูของผู้ใช้</div></div></div>
 ${[["pos","🛒 POS"],["drinks","🥤 น้ำปั่น"],["food","🍳 ตามสั่ง"],["stock","📦 สต็อก"],["debt","📒 ลูกหนี้"]].map(x=>`<label class="row" style="cursor:pointer"><div class="row-main"><div class="row-title">${x[1]}</div></div><input type="checkbox" ${u.access?.modules?.[x[0]]?"checked":""} ${modules[x[0]]===false?"disabled":""} onchange="setUserAccess('${esc(id)}','modules/${x[0]}',this.checked)"></label>`).join("")}
 </div>`).join("")||'<div class="empty-note">เพิ่มผู้ใช้งานก่อน</div>'}`;
}
function setUserAccess(uid,key,val){db.ref("shops/"+currentBranch.shopId+"/users/"+uid+"/access/"+key).set(val).then(()=>toast("อัปเดตสิทธิ์แล้ว")).catch(e=>toast("อัปเดตไม่สำเร็จ: "+e.message))}
</script>
</body>
</html>
