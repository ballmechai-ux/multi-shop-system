<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ชำระเงิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg1:#0f172a; --bg2:#1e293b; --card:#1e293b; --accent:#3b82f6; --accent2:#2563eb;
    --text:#f1f5f9; --sub:#94a3b8; --danger:#ef4444; --ok:#22c55e; --border:#334155;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Sarabun',sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh; color:var(--text); padding:16px; padding-bottom:60px;
  }
  .wrap{ max-width:480px; margin:0 auto; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .topbar h1{ font-family:'Kanit'; font-size:18px; }
  .back-link{ color:var(--accent); font-size:13px; cursor:pointer; }

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:18px; margin-bottom:14px;
  }
  .bill-line{ display:flex; justify-content:space-between; font-size:13px; padding:5px 0; color:var(--sub); }
  .bill-line.item{ color:var(--text); }
  .bill-line.grand{ font-family:'Kanit'; font-size:20px; color:var(--text); border-top:1px solid var(--border); margin-top:8px; padding-top:10px; }

  .method-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px; }
  .method-chip{
    padding:14px 8px; border-radius:14px; border:1px solid var(--border); background:#0f172a;
    text-align:center; cursor:pointer; font-family:'Kanit'; font-size:13.5px;
  }
  .method-chip .mi{ font-size:20px; display:block; margin-bottom:4px; }
  .method-chip.active{ border-color:var(--accent); background:#2563eb22; color:#93c5fd; }

  label{ font-size:12.5px; color:var(--sub); display:block; margin:12px 0 6px; }
  input{
    width:100%; padding:13px; border-radius:12px; border:1px solid var(--border);
    background:#0f172a; color:var(--text); font-size:16px; font-family:'Kanit';
  }
  .quick-cash{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .quick-cash div{
    background:#0f172a; border:1px solid var(--border); padding:8px 14px; border-radius:10px;
    font-size:13px; cursor:pointer;
  }
  .change-box{
    background:#0f172a; border:1px solid var(--border); border-radius:14px; padding:14px;
    text-align:center; margin-top:12px;
  }
  .change-box .clabel{ font-size:12.5px; color:var(--sub); }
  .change-box .cval{ font-family:'Kanit'; font-size:26px; color:var(--ok); margin-top:4px; }
  .change-box .cval.neg{ color:var(--danger); }

  .btn{
    width:100%; padding:15px; border:none; border-radius:14px; background:var(--accent);
    color:#fff; font-family:'Kanit'; font-size:16px; font-weight:500; cursor:pointer; margin-top:14px;
  }
  .btn:disabled{ background:#334155; color:#64748b; }
  .btn.outline{ background:transparent; border:1px solid var(--border); color:var(--sub); }

  .empty-note{ text-align:center; color:var(--sub); font-size:13px; padding:40px 20px; }
  .blocked{ text-align:center; padding:60px 20px; color:var(--sub); }
  .blocked h1{ font-family:'Kanit'; color:var(--text); font-size:20px; margin-bottom:10px; }
  #printArea{ position:absolute; left:-9999px; top:0; width:220px; background:#fff; color:#000; padding:12px; font-family:'Sarabun'; }
  #printArea h2{ font-family:'Kanit'; text-align:center; font-size:16px; margin-bottom:6px; }
  #printArea .pline{ display:flex; justify-content:space-between; font-size:12px; padding:2px 0; }
  #printArea .ptotal{ font-weight:bold; font-size:14px; border-top:1px solid #000; margin-top:6px; padding-top:6px; }
  @media print{ body *{ visibility:hidden; } #printArea, #printArea *{ visibility:visible; } #printArea{ position:absolute; left:0; top:0; } }
  .success-screen{ text-align:center; padding:30px 10px; }
  .success-icon{ font-size:48px; margin-bottom:10px; }
</style>
</head>
<body>
<div id="printArea"></div>
<div id="app"><div class="blocked">กำลังโหลด...</div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDmWjzmkCTjih7G1smod3-B8pR5OMxxud0",
  authDomain: "multi-shop-system.firebaseapp.com",
  databaseURL: "https://multi-shop-system-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "multi-shop-system",
  storageBucket: "multi-shop-system.firebasestorage.app",
  messagingSenderId: "99369473058",
  appId: "1:99369473058:web:07bd5fbc308f79f18ee67b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const app = document.getElementById('app');

const sessionRaw = localStorage.getItem('shopSession');
let session = null;
try{ session = JSON.parse(sessionRaw); }catch(e){}

let sale = null;
try{ sale = JSON.parse(localStorage.getItem('pendingSale')); }catch(e){}

let method = 'cash';

if(!session){
  app.innerHTML = `<div class="blocked"><h1>ยังไม่ได้เข้าสู่ระบบ</h1><br><a href="login.html" style="color:#3b82f6;">ไปหน้าเข้าสู่ระบบ</a></div>`;
} else if(!sale || !sale.items || sale.items.length === 0){
  app.innerHTML = `
    <div class="wrap">
      <div class="topbar"><h1>💰 ชำระเงิน</h1></div>
      <div class="empty-note">ยังไม่มีรายการที่รอชำระเงิน<br><br><a href="sell.html" style="color:#3b82f6;">← กลับไปหน้าขายสินค้า</a></div>
    </div>`;
} else {
  render();
}

function render(){
  app.innerHTML = `
    <div class="wrap">
      <div class="topbar">
        <h1>💰 ชำระเงิน</h1>
        <span class="back-link" onclick="location.href=(sale && sale.returnTo) || 'sell.html'">← กลับไปแก้บิล</span>
      </div>

      <div class="card">
        ${sale.items.map(it=>`<div class="bill-line item"><span>${it.name} x${it.qty}</span><span>฿${(it.price*it.qty - (it.discount||0)).toLocaleString()}</span></div>`).join('')}
        <div class="bill-line"><span>ยอดรวมสินค้า</span><span>฿${sale.subtotal.toLocaleString()}</span></div>
        <div class="bill-line"><span>ส่วนลดบิล</span><span>-฿${(sale.billDiscount||0).toLocaleString()}</span></div>
        <div class="bill-line grand"><span>ยอดสุทธิ</span><span>฿${sale.grandTotal.toLocaleString()}</span></div>
      </div>

      <div class="card">
        <label style="margin-top:0">วิธีชำระเงิน</label>
        <div class="method-grid">
          <div class="method-chip active" data-m="cash"><span class="mi">💵</span>เงินสด</div>
          <div class="method-chip" data-m="transfer"><span class="mi">🏦</span>โอนเงิน</div>
          <div class="method-chip" data-m="qr"><span class="mi">📱</span>QR Payment</div>
          <div class="method-chip" data-m="other"><span class="mi">➕</span>อื่นๆ</div>
        </div>

        <div id="cashSection">
          <label>รับเงินมา (บาท)</label>
          <input type="number" id="cashReceived" placeholder="0" inputmode="decimal">
          <div class="quick-cash" id="quickCash"></div>
          <div class="change-box">
            <div class="clabel">เงินทอน</div>
            <div class="cval" id="changeVal">฿0</div>
          </div>
        </div>
      </div>

      <button class="btn" id="paidBtn">✅ ชำระแล้ว</button>
      <button class="btn outline" id="unpaidBtn">📒 ลูกค้ายังไม่จ่าย (บันทึกเป็นหนี้)</button>
    </div>
  `;

  document.querySelectorAll('.method-chip').forEach(el=>{
    el.onclick = ()=>{
      method = el.dataset.m;
      document.querySelectorAll('.method-chip').forEach(c=>c.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('cashSection').style.display = method === 'cash' ? 'block' : 'none';
      updatePayButtonState();
    };
  });

  const quickAmts = [sale.grandTotal, ...[20,50,100,500,1000].filter(v=>v>=sale.grandTotal)].slice(0,4);
  document.getElementById('quickCash').innerHTML = [...new Set(quickAmts)].map(v=>`<div data-v="${v}">฿${v.toLocaleString()}</div>`).join('');
  document.querySelectorAll('#quickCash div').forEach(el=>{
    el.onclick = ()=>{
      document.getElementById('cashReceived').value = el.dataset.v;
      updateChange();
    };
  });

  document.getElementById('cashReceived').oninput = updateChange;
  document.getElementById('paidBtn').onclick = ()=> confirmPayment('paid');
  document.getElementById('unpaidBtn').onclick = ()=> confirmPayment('unpaid');
  updateChange();
}

function updateChange(){
  const received = parseFloat(document.getElementById('cashReceived').value) || 0;
  const change = received - sale.grandTotal;
  const el = document.getElementById('changeVal');
  el.textContent = '฿' + Math.abs(change).toLocaleString();
  el.className = 'cval' + (change < 0 ? ' neg' : '');
  updatePayButtonState();
}

function updatePayButtonState(){
  const paidBtn = document.getElementById('paidBtn');
  if(method === 'cash'){
    const received = parseFloat(document.getElementById('cashReceived').value) || 0;
    paidBtn.disabled = received < sale.grandTotal;
  } else {
    paidBtn.disabled = false;
  }
}

function confirmPayment(status){
  const received = method === 'cash' ? (parseFloat(document.getElementById('cashReceived').value)||0) : sale.grandTotal;
  const change = method === 'cash' ? received - sale.grandTotal : 0;

  if(status === 'unpaid'){
    location.href = 'debtor.html';
    return;
  }

  const basePath = `shops/${sale.shopId}/branches/${sale.branchId}`;
  const billRef = db.ref(basePath + '/bills').push();
  const billData = {
    items: sale.items,
    subtotal: sale.subtotal,
    billDiscount: sale.billDiscount || 0,
    total: sale.grandTotal,
    paymentMethod: method,
    cashReceived: method === 'cash' ? received : null,
    change: method === 'cash' ? change : 0,
    status: 'paid',
    staffUid: session.uid,
    staffName: session.name,
    date: Date.now()
  };

  db.ref(basePath + '/counters/bill').transaction(c=> (c||0) + 1).then(res=>{
    billData.billNo = 'B' + String(res.snapshot.val()).padStart(6,'0');
    return billRef.set(billData);
  }).then(()=>{
    // decrement stock for each item, and log the movement for stock.html's history tab
    const promises = sale.items.map(it=>{
      return db.ref(`${basePath}/products/${it.productId}/stock`).transaction(cur=> Math.max(0, (cur||0) - it.qty))
        .then(()=> db.ref(`${basePath}/stockLog`).push().set({
          type:'sale', productId: it.productId, productName: it.name, qty: it.qty,
          staffName: session.name, date: Date.now()
        }));
    });
    return Promise.all(promises);
  }).then(()=>{
    localStorage.removeItem('pendingSale');
    showSuccess(billData);
  }).catch(err=>{
    alert('เกิดข้อผิดพลาด: ' + err.message);
  });
}

function showSuccess(bill){
  lastBill = bill;
  app.innerHTML = `
    <div class="wrap">
      <div class="success-screen">
        <div class="success-icon">✅</div>
        <h1 style="font-family:'Kanit'">ชำระเงินสำเร็จ</h1>
        <div class="card" style="text-align:left; margin-top:16px;">
          <div class="bill-line"><span>เลขที่บิล</span><span><b>${bill.billNo}</b></span></div>
          <div class="bill-line"><span>ยอดชำระ</span><span>฿${bill.total.toLocaleString()}</span></div>
          <div class="bill-line"><span>วิธีชำระ</span><span>${ {cash:'เงินสด',transfer:'โอนเงิน',qr:'QR Payment',other:'อื่นๆ'}[bill.paymentMethod] }</span></div>
          ${bill.paymentMethod==='cash' ? `<div class="bill-line"><span>รับเงิน</span><span>฿${bill.cashReceived.toLocaleString()}</span></div>
          <div class="bill-line"><span>เงินทอน</span><span>฿${bill.change.toLocaleString()}</span></div>` : ''}
        </div>
        <button class="btn outline" onclick="printReceiptNow()">🖨️ พิมพ์ใบเสร็จ</button>
        <button class="btn" onclick="location.href=(sale && sale.returnTo) || 'sell.html'">🛒 ขายรายการถัดไป</button>
        <button class="btn outline" onclick="location.href='dashboard.html'">กลับไป Dashboard</button>
      </div>
    </div>
  `;
}

let lastBill = null;
/* ===== เอกสาร: ใบเสร็จ / ใบกำกับภาษี (ใช้ร่วมกัน) ===== */
function escH(t){ return String(t==null?'':t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function thMoney(n){ return (Number(n)||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function docNoOf(b, id){ return b.billNo || ('เก่า-' + String(id||'').slice(-6).toUpperCase()); }
const DEFAULT_DESIGN = { paper:'a4', title:'ใบกำกับภาษี / ใบเสร็จรับเงิน', branchText:'สำนักงานใหญ่', showLogo:true, showAddress:true, showPhone:true, showBranch:true, showUnitPrice:true, showDiscount:true, showSignature:true, showCopyLabel:true, accent:'#1d4ed8', footer:'' };

function receiptHTML(S, b, id){
  const mL = {cash:'เงินสด',transfer:'โอนเงิน',qr:'QR Payment',other:'อื่นๆ'};
  const vr = S.vatRate ?? 7;
  const vatLine = S.taxInvoiceEnabled ? `<div class="pline"><span>VAT ${vr}%</span><span>฿${(b.total - b.total/(1+vr/100)).toLocaleString(undefined,{maximumFractionDigits:2})}</span></div>` : '';
  return `
    ${S.logoUrl ? `<img src="${escH(S.logoUrl)}" style="max-width:80px; display:block; margin:0 auto 6px;">` : ''}
    <h2>${escH(S.shopName||'ร้านค้า')}</h2>
    ${S.address ? `<div style="text-align:center; font-size:10.5px; margin-bottom:4px;">${escH(S.address)}</div>` : ''}
    ${S.phone ? `<div style="text-align:center; font-size:10.5px; margin-bottom:4px;">โทร. ${escH(S.phone)}</div>` : ''}
    ${S.taxId ? `<div style="text-align:center; font-size:10.5px; margin-bottom:8px;">เลขผู้เสียภาษี ${escH(S.taxId)}</div>` : ''}
    <div style="text-align:center; font-family:'Kanit'; font-weight:bold; margin-bottom:6px;">ใบเสร็จรับเงิน${S.taxInvoiceEnabled ? ' / ใบกำกับภาษี' : ''}</div>
    <div class="pline"><span>เลขที่บิล</span><span><b>${escH(docNoOf(b,id))}</b></span></div>
    <div class="pline"><span>วันที่</span><span>${new Date(b.date).toLocaleString('th-TH')}</span></div>
    <div class="pline"><span>พนักงาน</span><span>${escH(b.staffName)}</span></div>
    <div style="margin:8px 0; border-top:1px dashed #000;"></div>
    ${(b.items||[]).map(it=>`<div class="pline"><span>${escH(it.name)} x${it.qty}</span><span>฿${(it.price*it.qty-(it.discount||0)).toLocaleString()}</span></div>`).join('')}
    <div class="pline ptotal"><span>ยอดสุทธิ</span><span>฿${b.total.toLocaleString()}</span></div>
    ${vatLine}
    <div class="pline"><span>ชำระโดย</span><span>${mL[b.paymentMethod]||'-'}</span></div>
    ${S.receiptFooter ? `<div style="text-align:center; font-size:10.5px; margin-top:10px; border-top:1px dashed #000; padding-top:6px;">${escH(S.receiptFooter)}</div>` : ''}`;
}

function renderInvoiceHTML(D, S, b, id, buyer){
  D = Object.assign({}, DEFAULT_DESIGN, D || {}); buyer = buyer || {}; S = S || {};
  const slip = D.paper !== 'a4';
  const width = D.paper === 'a4' ? '700px' : (D.paper === '80' ? '300px' : '220px');
  const vr = Number(S.vatRate ?? 7) || 0;
  const total = Number(b.total) || 0, base = total/(1+vr/100), vat = total - base;
  const col = D.accent || '#1d4ed8', fs = slip ? 11 : 13;
  const dots = '................................';
  const head = `<div style="text-align:center">${D.showLogo && S.logoUrl ? `<img src="${escH(S.logoUrl)}" style="max-height:${slip?50:70}px;margin-bottom:4px"><br>` : ''}
    <b style="font-size:${slip?14:18}px;font-family:Kanit">${escH(S.shopName||'ร้านค้า')}</b>
    ${D.showAddress && S.address ? `<div>${escH(S.address)}</div>` : ''}${D.showPhone && S.phone ? `<div>โทร. ${escH(S.phone)}</div>` : ''}
    <div>เลขประจำตัวผู้เสียภาษี ${escH(S.taxId||'-')}${D.showBranch && D.branchText ? ' · ' + escH(D.branchText) : ''}</div></div>`;
  const title = `<div style="margin:8px 0;padding:6px;background:${col};color:#fff;text-align:center;font-family:Kanit;font-size:${slip?13:16}px;-webkit-print-color-adjust:exact;print-color-adjust:exact">${escH(D.title)}${D.showCopyLabel ? ' (ต้นฉบับ)' : ''}</div>`;
  const meta = `<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px"><span>เลขที่ <b>${escH(docNoOf(b,id))}</b></span><span>วันที่ ${new Date(b.date).toLocaleString('th-TH')}</span></div>`;
  const buyerBox = `<div style="border:1px solid #999;padding:6px;margin:6px 0"><div>ผู้ซื้อ: ${buyer.name ? escH(buyer.name) : dots}</div><div>ที่อยู่: ${buyer.address ? escH(buyer.address) : dots}</div><div>เลขประจำตัวผู้เสียภาษี: ${buyer.taxId ? escH(buyer.taxId) : dots}</div></div>`;
  const showUnit = !slip && D.showUnitPrice, showDisc = !slip && D.showDiscount;
  const rows = (b.items||[]).map((it,i)=>`<tr><td>${i+1}</td><td>${escH(it.name)}</td><td style="text-align:right">${it.qty}</td>${showUnit?`<td style="text-align:right">${thMoney(it.price)}</td>`:''}${showDisc?`<td style="text-align:right">${thMoney(it.discount||0)}</td>`:''}<td style="text-align:right">${thMoney(it.price*it.qty-(it.discount||0))}</td></tr>`).join('');
  const table = `<style>.inv td,.inv th{border-bottom:1px solid #ddd;padding:3px}</style><table class="inv" style="width:100%;border-collapse:collapse;font-size:${fs}px"><tr style="background:#eee"><th>#</th><th style="text-align:left">รายการ</th><th>จำนวน</th>${showUnit?'<th>ราคา/หน่วย</th>':''}${showDisc?'<th>ส่วนลด</th>':''}<th>รวม</th></tr>${rows}</table>`;
  const r2 = (l,v)=>`<div style="display:flex;justify-content:space-between"><span>${l}</span><span>${v}</span></div>`;
  const bd = Number(b.billDiscount) || 0;
  const totals = `<div style="margin-top:8px;margin-left:auto;width:${slip?'100%':'55%'}">${bd?r2('ส่วนลดบิล','-'+thMoney(bd)):''}${r2('มูลค่าสินค้า (ก่อนภาษี)',thMoney(base))}${r2('ภาษีมูลค่าเพิ่ม '+vr+'%',thMoney(vat))}
    <div style="display:flex;justify-content:space-between;font-weight:bold;font-size:${fs+3}px;border-top:2px solid #000;margin-top:4px;padding-top:4px"><span>รวมทั้งสิ้น</span><span>${thMoney(total)}</span></div>
    <div style="font-size:${fs-2}px;color:#555">ราคารวมภาษีมูลค่าเพิ่มแล้ว</div></div>`;
  const sign = D.showSignature ? `<div style="display:flex;justify-content:space-around;margin-top:${slip?16:36}px;text-align:center;font-size:${fs}px"><div>..............................<br>ผู้รับเงิน</div><div>..............................<br>ผู้ซื้อ</div></div>` : '';
  const foot = D.footer ? `<div style="text-align:center;font-size:${fs-1}px;margin-top:10px;border-top:1px dashed #000;padding-top:6px">${escH(D.footer)}</div>` : '';
  return { width, html: `<div style="font-family:Sarabun,sans-serif;font-size:${fs}px;color:#000;background:#fff">${head}${title}${meta}${buyerBox}${table}${totals}${sign}${foot}</div>` };
}

function printReceiptNow(){
  const base = `shops/${sale.shopId}/branches/${sale.branchId}`;
  db.ref(base + '/settings').once('value').then(sn=>{
    const S = sn.val() || {};
    const area = document.getElementById('printArea');
    area.style.width = S.paperWidth === '80' ? '300px' : '220px';
    area.innerHTML = receiptHTML(S, lastBill, '');
    setTimeout(()=> window.print(), 300);
  });
}
</script>
</body>
</html>
