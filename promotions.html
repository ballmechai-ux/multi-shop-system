<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>โปรโมชั่น</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg1:#0f172a; --bg2:#1e293b; --card:#1e293b; --accent:#3b82f6; --accent2:#2563eb;
    --text:#f1f5f9; --sub:#94a3b8; --danger:#ef4444; --ok:#22c55e; --warn:#fbbf24; --border:#334155;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Sarabun',sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh; color:var(--text); padding:14px; padding-bottom:60px;
  }
  .wrap{ max-width:640px; margin:0 auto; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .topbar h1{ font-family:'Kanit'; font-size:18px; }
  .topbar .who{ font-size:11px; color:var(--sub); text-align:right; }

  .nav-bar{ display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; padding-bottom:4px; }
  @media (min-width:700px){
    .nav-bar{ flex-wrap:wrap; overflow-x:visible; }
  }
  .nav-bar::-webkit-scrollbar{ display:none; }
  .nav-item{
    flex:0 0 auto; background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:8px 14px; font-size:12px; color:var(--sub); cursor:pointer; white-space:nowrap; text-decoration:none;
  }
  .nav-item.active{ border-color:var(--accent); color:#93c5fd; background:#2563eb22; }

  .current-shop-banner{
    display:flex; align-items:center; gap:8px; background:#2563eb22; border:1px solid var(--accent);
    border-radius:14px; padding:10px 14px; margin-bottom:12px; font-family:'Kanit'; font-size:14px; color:#93c5fd;
  }
  .current-shop-banner .pin{ font-size:16px; }

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:18px; margin-bottom:14px;
  }
  .card h2{ font-family:'Kanit'; font-size:15px; margin-bottom:12px; }
  label{ font-size:12.5px; color:var(--sub); display:block; margin-bottom:5px; }
  input{
    width:100%; padding:12px 13px; margin-bottom:10px; border-radius:12px;
    border:1px solid var(--border); background:#0f172a; color:var(--text); font-size:14px; font-family:'Sarabun';
  }
  .search-results{ max-height:220px; overflow-y:auto; margin-bottom:6px; }
  .search-item{
    background:#0f172a; border:1px solid var(--border); border-radius:10px; padding:10px 12px;
    margin-bottom:6px; cursor:pointer; display:flex; justify-content:space-between; font-size:13px;
  }
  .search-item:active{ border-color:var(--accent); }
  .search-item.has-promo{ opacity:.5; }

  .selected-box{
    background:#0f172a; border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px;
  }
  .selected-box .sname{ font-family:'Kanit'; font-size:14.5px; }
  .selected-box .sprice{ font-size:12.5px; color:var(--sub); margin-top:2px; }
  .change-btn{ color:var(--accent); font-size:12px; cursor:pointer; }

  .preview-price{ font-family:'Kanit'; font-size:13px; margin:-2px 0 10px; }
  .preview-price .orig{ text-decoration:line-through; color:var(--sub); margin-right:6px; }
  .preview-price .disc{ color:var(--ok); font-size:16px; }

  .btn{
    width:100%; padding:14px; border:none; border-radius:12px; background:var(--accent);
    color:#fff; font-family:'Kanit'; font-size:15px; font-weight:500; cursor:pointer; margin-top:6px;
  }
  .btn.outline{ background:transparent; border:1px solid var(--border); color:var(--sub); }
  .msg{ font-size:13px; margin-top:8px; min-height:16px; }
  .msg.error{ color:var(--danger); }
  .msg.ok{ color:var(--ok); }

  .promo-item{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:13px 14px; margin-bottom:9px;
  }
  .promo-item.inactive{ opacity:.55; }
  .promo-item .top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .promo-item .pname{ font-family:'Kanit'; font-size:14.5px; }
  .promo-item .pprice{ font-size:12.5px; margin-top:4px; }
  .promo-item .pprice .orig{ text-decoration:line-through; color:var(--sub); margin-right:6px; }
  .promo-item .pprice .disc{ color:var(--ok); font-family:'Kanit'; font-size:14px; }
  .promo-badge{
    font-size:11px; padding:2px 9px; border-radius:20px; background:#ef444433; color:#f87171; font-family:'Kanit';
  }
  .promo-actions{ display:flex; gap:8px; margin-top:10px; }
  .promo-actions button{
    flex:1; padding:9px; border-radius:10px; border:1px solid var(--border); background:#0f172a;
    color:var(--text); font-family:'Kanit'; font-size:12.5px; cursor:pointer;
  }
  .promo-actions button.danger{ border-color:var(--danger); color:var(--danger); }

  .switch{ position:relative; width:40px; height:22px; flex:0 0 auto; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:var(--border); border-radius:22px; cursor:pointer; transition:.2s; }
  .slider:before{ content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  input:checked + .slider{ background:var(--ok); }
  input:checked + .slider:before{ transform:translateX(18px); }

  .empty-note{ text-align:center; color:var(--sub); font-size:13px; padding:20px 14px; }
  .blocked{ text-align:center; padding:60px 20px; color:var(--sub); }
  .blocked h1{ font-family:'Kanit'; color:var(--text); font-size:20px; margin-bottom:10px; }
</style>
</head>
<body>
<div id="app"><div class="blocked">กำลังตรวจสอบสิทธิ์...</div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDmWjzmkCTjih7G1smod3-B8pR5OMxxud0",
  authDomain: "multi-shop-system.firebaseapp.com",
  databaseURL: "https://multi-shop-system-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "multi-shop-system",
  storageBucket: "multi-shop-system.firebasestorage.app",
  messagingSenderId: "99369473058",
  appId: "1:99369473058:web:07bd5fbc308f79f18ee67b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const app = document.getElementById('app');

const sessionRaw = localStorage.getItem('shopSession');
let session = null;
try{ session = JSON.parse(sessionRaw); }catch(e){}

if(!session){
  app.innerHTML = `<div class="blocked"><h1>ยังไม่ได้เข้าสู่ระบบ</h1><br><a href="login.html" style="color:#3b82f6;">ไปหน้าเข้าสู่ระบบ</a></div>`;
} else if(session.role !== 'admin' && !(session.permissions && session.permissions.editPrice)){
  app.innerHTML = `<div class="blocked"><h1>ไม่มีสิทธิ์จัดการโปรโมชั่น</h1><p>บัญชีนี้ไม่ได้รับสิทธิ์ "แก้ราคา" กรุณาติดต่อแอดมิน</p><br><a href="login.html" style="color:#3b82f6;">กลับหน้าเข้าสู่ระบบ</a></div>`;
} else {
  boot();
}

let shopsCache = {};
let branchOptions = [];
let currentBranch = null;
let productsCache = {};
let promosCache = {};
let selectedProductId = null;

function boot(){
  db.ref('shops').on('value', snap=>{
    shopsCache = snap.val() || {};
    buildBranchOptions();
    renderShell();
  });
}

function buildBranchOptions(){
  branchOptions = [];
  Object.keys(shopsCache).forEach(shopId=>{
    const shop = shopsCache[shopId];
    const info = shop.info || {};
    const branches = shop.branches || {};
    const branchIds = Object.keys(branches);
    let allowed = branchIds;
    if(session.role !== 'admin'){
      const access = session.access || {};
      if(!access[shopId]) return;
      allowed = branchIds.filter(bid => access[shopId][bid]);
    }
    allowed.forEach(bid=>{
      branchOptions.push({ shopId, shopName: info.name, branchId: bid, branchName: branches[bid].name });
    });
  });
  if(!currentBranch && branchOptions.length){
    currentBranch = pickInitialBranch(branchOptions);
  }
}

function pickInitialBranch(options){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem('currentShopBranch')); }catch(e){}
  if(saved && options.some(b=>b.shopId===saved.shopId && b.branchId===saved.branchId)){
    return { shopId: saved.shopId, branchId: saved.branchId };
  }
  return { shopId: options[0].shopId, branchId: options[0].branchId };
}

function renderShell(){
  const roleLabel = {admin:'ADMIN', owner:'OWNER', staff:'STAFF'}[session.role] || session.role;
  app.innerHTML = `
    <div class="wrap">
      <div class="topbar">
        <h1>🔥 โปรโมชั่น</h1>
        <div class="who">${session.name}<br><span style="color:#93c5fd">${roleLabel}</span></div>
      </div>
      <div class="nav-bar" id="navBar"></div>
      <div class="current-shop-banner" id="currentShopBanner"></div>
      <div id="mainContent"></div>
    </div>
  `;
  renderNavBar();
  renderBanner();
  renderMainContent();
}

function renderNavBar(){
  const wrap = document.getElementById('navBar');
  const items = [
    { href:'dashboard.html', icon:'🏠', label:'Dashboard', show:true },
    { href:'sell.html', icon:'🛒', label:'ขายสินค้า', show: session.role==='admin' || (session.permissions&&session.permissions.sell) },
    { href:'products.html', icon:'📦', label:'สินค้า', show:true },
    { href:'stock.html', icon:'📊', label:'สต็อก', show:true },
    { href:'receive.html', icon:'📥', label:'รับสินค้าเข้า', show:true },
    { href:'pricetag.html', icon:'🏷️', label:'ป้ายราคา', show:true },
    { href:'promotions.html', icon:'🔥', label:'โปรโมชั่น', show:true },
    { href:'sales.html', icon:'🧾', label:'รายการขาย', show:true },
    { href:'reports.html', icon:'📈', label:'รายงาน', show: session.role==='admin' || (session.permissions&&session.permissions.viewReport) },
    { href:'shops.html', icon:'🏪', label:'ร้าน/สาขา', show: session.role==='admin' },
    { href:'staffs.html', icon:'👨‍💼', label:'พนักงาน', show: session.role==='admin' },
    { href:'settings.html', icon:'⚙️', label:'ตั้งค่า', show: session.role==='admin' || (session.permissions&&session.permissions.manageSystem) }
  ];
  wrap.innerHTML = items.filter(i=>i.show).map(i=>
    `<a class="nav-item ${i.href==='promotions.html'?'active':''}" href="${i.href}">${i.icon} ${i.label}</a>`
  ).join('');
}

function renderBanner(){
  const banner = document.getElementById('currentShopBanner');
  if(!banner) return;
  if(branchOptions.length === 0){
    banner.style.display = 'flex';
    banner.innerHTML = `ยังไม่มีร้าน/สาขาที่เข้าถึงได้`;
    return;
  }
  const cur = branchOptions.find(b=>b.shopId===currentBranch.shopId && b.branchId===currentBranch.branchId);
  if(cur){
    banner.style.display = 'flex';
    banner.innerHTML = `<span class="pin">📍</span> กำลังตั้งโปรโมชั่นร้าน: <b>${cur.shopName} · ${cur.branchName}</b><a href="home.html" style="margin-left:auto; color:inherit; text-decoration:underline; font-size:12px;">🔄 เปลี่ยนร้าน</a>`;
  }
}

function renderMainContent(){
  const content = document.getElementById('mainContent');
  if(!currentBranch){
    content.innerHTML = `<div class="empty-note">ยังไม่มีร้าน/สาขา — ไปเพิ่มร้านที่ shops.html ก่อน</div>`;
    return;
  }
  content.innerHTML = `
    <div class="card">
      <h2>โปรโมชั่นที่ใช้งานอยู่</h2>
      <div id="promoList"></div>
    </div>
    <div class="card">
      <h2>➕ เพิ่มโปรโมชั่นใหม่</h2>
      <div id="pickerArea"></div>
    </div>
  `;

  const basePath = `shops/${currentBranch.shopId}/branches/${currentBranch.branchId}`;
  db.ref(basePath + '/products').on('value', snap=>{
    productsCache = snap.val() || {};
    if(selectedProductId && !productsCache[selectedProductId]) selectedProductId = null;
    renderPickerArea();
  });
  db.ref(basePath + '/promotions').on('value', snap=>{
    promosCache = snap.val() || {};
    renderPromoList();
    renderPickerArea();
  });
}

function getPromoForProduct(productId){
  return Object.keys(promosCache).find(pid => promosCache[pid].productId === productId);
}

function renderPromoList(){
  const wrap = document.getElementById('promoList');
  if(!wrap) return;
  const ids = Object.keys(promosCache);
  if(ids.length === 0){
    wrap.innerHTML = `<div class="empty-note">ยังไม่มีโปรโมชั่น เพิ่มรายการแรกได้ด้านล่าง</div>`;
    return;
  }
  wrap.innerHTML = ids.map(id=>{
    const promo = promosCache[id];
    const p = productsCache[promo.productId];
    const name = p ? p.name : (promo.productName || '(สินค้าถูกลบไปแล้ว)');
    const origPrice = p ? (p.sellPrice||0) : (promo.originalPrice||0);
    const discPrice = origPrice * (1 - promo.discountPercent/100);
    return `<div class="promo-item ${promo.active===false?'inactive':''}" data-id="${id}">
      <div class="top">
        <div>
          <div class="pname">${name}</div>
          <div class="pprice"><span class="orig">฿${origPrice.toLocaleString()}</span><span class="disc">฿${discPrice.toLocaleString(undefined,{maximumFractionDigits:2})}</span></div>
        </div>
        <span class="promo-badge">-${promo.discountPercent}%</span>
      </div>
      <div class="promo-actions">
        <label class="switch" style="align-self:center; margin-right:auto;">
          <input type="checkbox" class="promo-active-toggle" data-id="${id}" ${promo.active!==false?'checked':''}>
          <span class="slider"></span>
        </label>
        <button class="danger" data-del="${id}">ลบโปรโมชั่น</button>
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('.promo-active-toggle').forEach(el=>{
    el.onchange = (e)=>{
      const id = e.target.dataset.id;
      const basePath = `shops/${currentBranch.shopId}/branches/${currentBranch.branchId}/promotions/${id}`;
      db.ref(basePath + '/active').set(e.target.checked);
    };
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = ()=>{
      if(!confirm('ยืนยันลบโปรโมชั่นนี้?')) return;
      const basePath = `shops/${currentBranch.shopId}/branches/${currentBranch.branchId}/promotions/${el.dataset.del}`;
      db.ref(basePath).remove();
    };
  });
}

function renderPickerArea(){
  const area = document.getElementById('pickerArea');
  if(!area) return;

  if(!selectedProductId){
    area.innerHTML = `
      <label>ค้นหาสินค้าที่จะทำโปรโมชั่น</label>
      <input type="text" id="promoSearch" placeholder="🔍 ค้นหาชื่อสินค้า">
      <div class="search-results" id="promoSearchResults"></div>
    `;
    document.getElementById('promoSearch').oninput = renderPromoSearchResults;
    return;
  }

  const p = productsCache[selectedProductId];
  const existingPromoId = getPromoForProduct(selectedProductId);
  area.innerHTML = `
    <div class="selected-box">
      <div class="sname">${p.name}</div>
      <div class="sprice">ราคาปกติ ฿${(p.sellPrice||0).toLocaleString()} <span class="change-btn" id="changeProdBtn">(เปลี่ยนสินค้า)</span></div>
    </div>
    <label>ส่วนลด (%)</label>
    <input type="number" id="promoPercent" min="1" max="99" value="${existingPromoId ? promosCache[existingPromoId].discountPercent : ''}" placeholder="เช่น 10">
    <div class="preview-price" id="promoPreview"></div>
    <button class="btn" id="savePromoBtn">${existingPromoId ? '💾 อัปเดตโปรโมชั่น' : '💾 สร้างโปรโมชั่น'}</button>
    <div class="msg" id="promoMsg"></div>
  `;
  document.getElementById('changeProdBtn').onclick = ()=>{ selectedProductId = null; renderPickerArea(); };
  document.getElementById('promoPercent').oninput = updatePromoPreview;
  document.getElementById('savePromoBtn').onclick = ()=> savePromo(existingPromoId);
  updatePromoPreview();
}

function updatePromoPreview(){
  const p = productsCache[selectedProductId];
  const pct = parseFloat(document.getElementById('promoPercent').value) || 0;
  const el = document.getElementById('promoPreview');
  if(pct <= 0 || pct >= 100){ el.innerHTML = ''; return; }
  const orig = p.sellPrice || 0;
  const disc = orig * (1 - pct/100);
  el.innerHTML = `ราคาหลังลด: <span class="orig">฿${orig.toLocaleString()}</span><span class="disc">฿${disc.toLocaleString(undefined,{maximumFractionDigits:2})}</span>`;
}

function renderPromoSearchResults(){
  const q = document.getElementById('promoSearch').value.trim().toLowerCase();
  const wrap = document.getElementById('promoSearchResults');
  if(!q){ wrap.innerHTML = ''; return; }
  const ids = Object.keys(productsCache).filter(id=>
    (productsCache[id].name||'').toLowerCase().includes(q)
  ).slice(0,8);
  if(ids.length === 0){ wrap.innerHTML = `<div class="empty-note">ไม่พบสินค้า</div>`; return; }
  wrap.innerHTML = ids.map(id=>{
    const p = productsCache[id];
    const hasPromo = !!getPromoForProduct(id);
    return `<div class="search-item ${hasPromo?'has-promo':''}" data-id="${id}">
      <span>${p.name}${hasPromo ? ' (มีโปรอยู่แล้ว)' : ''}</span><span>฿${(p.sellPrice||0).toLocaleString()}</span>
    </div>`;
  }).join('');
  document.querySelectorAll('.search-item').forEach(el=>{
    el.onclick = ()=>{
      selectedProductId = el.dataset.id;
      renderPickerArea();
    };
  });
}

function savePromo(existingPromoId){
  const p = productsCache[selectedProductId];
  const pct = parseFloat(document.getElementById('promoPercent').value) || 0;
  const msg = document.getElementById('promoMsg');
  msg.className = 'msg error';
  if(pct <= 0 || pct >= 100){ msg.textContent = 'กรุณากรอกเปอร์เซ็นต์ส่วนลด 1-99'; return; }

  const basePath = `shops/${currentBranch.shopId}/branches/${currentBranch.branchId}/promotions`;
  const promoData = {
    productId: selectedProductId,
    productName: p.name,
    originalPrice: p.sellPrice || 0,
    discountPercent: pct,
    active: true,
    createdAt: Date.now(),
    createdBy: session.name
  };
  const ref = existingPromoId ? db.ref(basePath + '/' + existingPromoId) : db.ref(basePath).push();
  ref.set(promoData).then(()=>{
    msg.className = 'msg ok';
    msg.textContent = 'บันทึกโปรโมชั่นสำเร็จ';
    selectedProductId = null;
    setTimeout(renderPickerArea, 600);
  }).catch(err=>{
    msg.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
  });
}
</script>
</body>
</html>
