<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>รายการขาย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg1:#0f172a; --bg2:#1e293b; --card:#1e293b; --accent:#3b82f6; --accent2:#2563eb;
    --text:#f1f5f9; --sub:#94a3b8; --danger:#ef4444; --ok:#22c55e; --warn:#fbbf24; --border:#334155;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Sarabun',sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh; color:var(--text); padding:14px; padding-bottom:60px;
  }
  .wrap{ max-width:640px; margin:0 auto; }

  @media (min-width:900px){
    .wrap{ max-width:900px; }
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .topbar h1{ font-family:'Kanit'; font-size:18px; }
  .topbar .who{ font-size:11px; color:var(--sub); text-align:right; }

  .nav-bar{ display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; padding-bottom:4px; }

  @media (min-width:700px){
    .nav-bar{ flex-wrap:wrap; overflow-x:visible; }
  }
  .nav-bar::-webkit-scrollbar{ display:none; }
  .nav-item{
    flex:0 0 auto; background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:8px 14px; font-size:12px; color:var(--sub); cursor:pointer; white-space:nowrap; text-decoration:none;
  }
  .nav-item.active{ border-color:var(--accent); color:#93c5fd; background:#2563eb22; }

  .current-shop-banner{
    display:flex; align-items:center; gap:8px; background:#2563eb22; border:1px solid var(--accent);
    border-radius:14px; padding:10px 14px; margin-bottom:12px; font-family:'Kanit'; font-size:14px; color:#93c5fd;
  }
  .current-shop-banner .pin{ font-size:16px; }

  .filter-row{ display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; padding-bottom:4px; }
  .filter-row::-webkit-scrollbar{ display:none; }
  .filter-chip{
    flex:0 0 auto; background:var(--card); border:1px solid var(--border); border-radius:20px;
    padding:7px 14px; font-size:12px; color:var(--sub); cursor:pointer; white-space:nowrap;
  }
  .filter-chip.active{ border-color:var(--accent); color:#93c5fd; background:#2563eb22; }
  .custom-range{ display:none; gap:8px; margin-bottom:12px; }
  .custom-range.show{ display:flex; }
  .custom-range input{ flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:13px; }

  .summary-bar{
    display:flex; justify-content:space-between; background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:12px 16px; margin-bottom:12px; font-family:'Kanit'; font-size:13px;
  }
  .summary-bar b{ color:#93c5fd; font-size:15px; }

  .bill-item{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:13px 14px; margin-bottom:9px; cursor:pointer;
  }
  .bill-item .brow{ display:flex; justify-content:space-between; align-items:flex-start; }
  .bill-item .btime{ font-family:'Kanit'; font-size:14px; }
  .bill-item .bmeta{ font-size:11.5px; color:var(--sub); margin-top:3px; }
  .bill-item .btotal{ font-family:'Kanit'; font-size:16px; color:#93c5fd; }
  .status-badge{ font-size:10px; padding:1px 8px; border-radius:20px; font-family:'Kanit'; margin-top:5px; display:inline-block; }
  .status-badge.paid{ background:#22c55e33; color:#4ade80; }
  .status-badge.unpaid{ background:#ef444433; color:#f87171; }
  .status-badge.returned{ background:#fbbf2433; color:#fbbf24; }
  .status-badge.cancelled{ background:#64748b33; color:#94a3b8; }

  .empty-note{ text-align:center; color:var(--sub); font-size:13px; padding:30px 14px; }
  .blocked{ text-align:center; padding:60px 20px; color:var(--sub); }
  .blocked h1{ font-family:'Kanit'; color:var(--text); font-size:20px; margin-bottom:10px; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
    align-items:flex-end; justify-content:center; z-index:60;
  }
  .modal-overlay.show{ display:flex; }
  .modal-sheet{
    background:#0b1222; border-radius:22px 22px 0 0; width:100%; max-width:600px;
    padding:20px; max-height:85vh; overflow-y:auto;
  }
  .modal-sheet h2{ font-family:'Kanit'; font-size:16px; margin-bottom:12px; }
  .detail-line{ display:flex; justify-content:space-between; font-size:13px; padding:5px 0; color:var(--sub); }
  .detail-line.item{ color:var(--text); }
  .detail-line.grand{ font-family:'Kanit'; font-size:18px; color:var(--text); border-top:1px solid var(--border); margin-top:8px; padding-top:10px; }
  .modal-actions{ display:flex; flex-direction:column; gap:8px; margin-top:16px; }
  .modal-actions button{
    padding:12px; border-radius:12px; border:1px solid var(--border); background:#0f172a;
    color:var(--text); font-family:'Kanit'; font-size:13.5px; cursor:pointer;
  }
  .modal-actions button.danger{ border-color:var(--danger); color:var(--danger); }
  .modal-actions button.primary{ background:var(--accent); border:none; color:#fff; }

  #printArea{ position:absolute; left:-9999px; top:0; width:320px; background:#fff; color:#000; padding:16px; font-family:'Sarabun'; }
  #printArea h2{ font-family:'Kanit'; text-align:center; font-size:16px; margin-bottom:6px; }
  #printArea .pline{ display:flex; justify-content:space-between; font-size:12px; padding:2px 0; }
  #printArea .ptotal{ font-weight:bold; font-size:14px; border-top:1px solid #000; margin-top:6px; padding-top:6px; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ position:absolute; left:0; top:0; }
  }
</style>
</head>
<body>
<div id="app"><div class="blocked">กำลังตรวจสอบสิทธิ์...</div></div>
<div id="printArea"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDmWjzmkCTjih7G1smod3-B8pR5OMxxud0",
  authDomain: "multi-shop-system.firebaseapp.com",
  databaseURL: "https://multi-shop-system-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "multi-shop-system",
  storageBucket: "multi-shop-system.firebasestorage.app",
  messagingSenderId: "99369473058",
  appId: "1:99369473058:web:07bd5fbc308f79f18ee67b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const app = document.getElementById('app');

const sessionRaw = localStorage.getItem('shopSession');
let session = null;
try{ session = JSON.parse(sessionRaw); }catch(e){}

if(!session){
  app.innerHTML = `<div class="blocked"><h1>ยังไม่ได้เข้าสู่ระบบ</h1><br><a href="login.html" style="color:#3b82f6;">ไปหน้าเข้าสู่ระบบ</a></div>`;
} else if(session.role !== 'admin' && !(session.permissions && session.permissions.viewReport)){
  app.innerHTML = `<div class="blocked"><h1>ไม่มีสิทธิ์ดูรายการขาย</h1><p>บัญชีนี้ไม่ได้รับสิทธิ์ "ดูรายงาน" กรุณาติดต่อแอดมิน</p><br><a href="login.html" style="color:#3b82f6;">กลับหน้าเข้าสู่ระบบ</a></div>`;
} else {
  boot();
}

let shopsCache = {};
let branchOptions = [];
let currentBranch = null;
let billsCache = {};
let shopSettings = {};
let activeRange = 'today';

function boot(){
  db.ref('shops').on('value', snap=>{
    shopsCache = snap.val() || {};
    buildBranchOptions();
    renderShell();
  });
}

function buildBranchOptions(){
  branchOptions = [];
  Object.keys(shopsCache).forEach(shopId=>{
    const shop = shopsCache[shopId];
    const info = shop.info || {};
    const branches = shop.branches || {};
    const branchIds = Object.keys(branches);
    let allowed = branchIds;
    if(session.role !== 'admin'){
      const access = session.access || {};
      if(!access[shopId]) return;
      allowed = branchIds.filter(bid => access[shopId][bid]);
    }
    allowed.forEach(bid=>{
      branchOptions.push({ shopId, shopName: info.name, branchId: bid, branchName: branches[bid].name });
    });
  });
  if(!currentBranch && branchOptions.length){
    currentBranch = pickInitialBranch(branchOptions);
  }
}

function pickInitialBranch(options){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem('currentShopBranch')); }catch(e){}
  if(saved && options.some(b=>b.shopId===saved.shopId && b.branchId===saved.branchId)){
    return { shopId: saved.shopId, branchId: saved.branchId };
  }
  return { shopId: options[0].shopId, branchId: options[0].branchId };
}

function renderShell(){
  const roleLabel = {admin:'ADMIN', owner:'OWNER', staff:'STAFF'}[session.role] || session.role;
  app.innerHTML = `
    <div class="wrap">
      <div class="topbar">
        <h1>🧾 รายการขาย</h1>
        <div class="who">${session.name}<br><span style="color:#93c5fd">${roleLabel}</span></div>
      </div>
      <div class="nav-bar" id="navBar"></div>
      <div class="current-shop-banner" id="currentShopBanner"></div>
      <div id="mainContent"></div>
    </div>
    <div class="modal-overlay" id="modalOverlay"><div class="modal-sheet" id="modalSheet"></div></div>
  `;
  document.getElementById('modalOverlay').onclick = (e)=>{ if(e.target.id==='modalOverlay') closeModal(); };
  renderNavBar();
  renderBanner();
  renderMainContent();
}

function renderNavBar(){
  const wrap = document.getElementById('navBar');
  const items = [
    { href:'dashboard.html', icon:'🏠', label:'Dashboard', show:true },
    { href:'sell.html', icon:'🛒', label:'ขายสินค้า', show: session.role==='admin' || (session.permissions&&session.permissions.sell) },
    { href:'products.html', icon:'📦', label:'สินค้า', show:true },
    { href:'stock.html', icon:'📊', label:'สต็อก', show:true },
    { href:'pricetag.html', icon:'🏷️', label:'ป้ายราคา', show:true },
    { href:'promotions.html', icon:'🔥', label:'โปรโมชั่น', show:true },
    { href:'sales.html', icon:'🧾', label:'รายการขาย', show:true },
    { href:'debtors.html', icon:'📒', label:'ลูกหนี้', show:true },
    { href:'reports.html', icon:'📈', label:'รายงาน', show: session.role==='admin' || (session.permissions&&session.permissions.viewReport) },
    { href:'shops.html', icon:'🏪', label:'ร้าน/สาขา', show: session.role==='admin' },
    { href:'staffs.html', icon:'👨‍💼', label:'พนักงาน', show: session.role==='admin' },
    { href:'settings.html', icon:'⚙️', label:'ตั้งค่า', show: session.role==='admin' || (session.permissions&&session.permissions.manageSystem) }
  ];
  wrap.innerHTML = items.filter(i=>i.show).map(i=>
    `<a class="nav-item ${i.href==='sales.html'?'active':''}" href="${i.href}">${i.icon} ${i.label}</a>`
  ).join('');
}

function renderBanner(){
  const banner = document.getElementById('currentShopBanner');
  if(!banner) return;
  if(branchOptions.length === 0){
    banner.style.display = 'flex';
    banner.innerHTML = `ยังไม่มีร้าน/สาขาที่เข้าถึงได้`;
    return;
  }
  const cur = branchOptions.find(b=>b.shopId===currentBranch.shopId && b.branchId===currentBranch.branchId);
  if(cur){
    banner.style.display = 'flex';
    banner.innerHTML = `<span class="pin">📍</span> กำลังดูรายการขายร้าน: <b>${cur.shopName} · ${cur.branchName}</b><a href="home.html" style="margin-left:auto; color:inherit; text-decoration:underline; font-size:12px;">🔄 เปลี่ยนร้าน</a>`;
  }
}

function renderMainContent(){
  const content = document.getElementById('mainContent');
  if(!currentBranch){
    content.innerHTML = `<div class="empty-note">ยังไม่มีร้าน/สาขา — ไปเพิ่มร้านที่ shops.html ก่อน</div>`;
    return;
  }
  content.innerHTML = `
    <div class="filter-row" id="filterRow">
      <div class="filter-chip ${activeRange==='today'?'active':''}" data-r="today">วันนี้</div>
      <div class="filter-chip ${activeRange==='yesterday'?'active':''}" data-r="yesterday">เมื่อวาน</div>
      <div class="filter-chip ${activeRange==='7d'?'active':''}" data-r="7d">7 วัน</div>
      <div class="filter-chip ${activeRange==='month'?'active':''}" data-r="month">เดือนนี้</div>
      <div class="filter-chip ${activeRange==='custom'?'active':''}" data-r="custom">กำหนดวันที่</div>
    </div>
    <div class="custom-range ${activeRange==='custom'?'show':''}" id="customRange">
      <input type="date" id="rangeFrom">
      <input type="date" id="rangeTo">
    </div>
    <input id="billSearch" placeholder="🔍 ค้นหาเลขที่บิล (ค้นหาทุกวัน)" style="width:100%;padding:11px 13px;margin-bottom:10px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#f1f5f9;font-size:14px">
    <div class="summary-bar" id="summaryBar"></div>
    <div id="billList"></div>
  `;
  document.querySelectorAll('.filter-chip').forEach(el=>{
    el.onclick = ()=>{
      activeRange = el.dataset.r;
      renderMainContent();
    };
  });
  document.getElementById('billSearch').oninput = renderBillList;
  if(activeRange === 'custom'){
    document.getElementById('rangeFrom').onchange = renderBillList;
    document.getElementById('rangeTo').onchange = renderBillList;
  }

  const basePath = `shops/${currentBranch.shopId}/branches/${currentBranch.branchId}`;
  db.ref(basePath + '/settings').once('value').then(snap=>{ shopSettings = snap.val() || {}; });
  db.ref(basePath + '/bills').on('value', snap=>{
    billsCache = snap.val() || {};
    renderBillList();
  });
}

function getRangeBounds(){
  const now = new Date();
  let start, end;
  if(activeRange === 'today'){
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    end = new Date(start.getTime() + 86400000 - 1);
  } else if(activeRange === 'yesterday'){
    const y = new Date(now); y.setDate(y.getDate()-1);
    start = new Date(y.getFullYear(), y.getMonth(), y.getDate());
    end = new Date(start.getTime() + 86400000 - 1);
  } else if(activeRange === '7d'){
    start = new Date(now.getTime() - 6*86400000);
    start = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23,59,59);
  } else if(activeRange === 'month'){
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date(now.getFullYear(), now.getMonth()+1, 0, 23,59,59);
  } else {
    const fromVal = document.getElementById('rangeFrom')?.value;
    const toVal = document.getElementById('rangeTo')?.value;
    start = fromVal ? new Date(fromVal) : new Date(0);
    end = toVal ? new Date(toVal + 'T23:59:59') : new Date();
  }
  return { start, end };
}

function renderBillList(){
  const listEl = document.getElementById('billList');
  const summaryEl = document.getElementById('summaryBar');
  if(!listEl) return;
  const { start, end } = getRangeBounds();

  const sq = ((document.getElementById('billSearch')||{}).value || '').trim().toLowerCase();
  let ids = Object.keys(billsCache).filter(id=>{
    if(sq) return docNoOf(billsCache[id], id).toLowerCase().includes(sq);
    const d = new Date(billsCache[id].date);
    return d >= start && d <= end;
  });
  ids.sort((a,b)=> billsCache[b].date - billsCache[a].date);

  const activeBills = ids.filter(id => billsCache[id].status !== 'cancelled');
  const totalRevenue = activeBills.reduce((s,id)=> s + (billsCache[id].total||0), 0);
  summaryEl.innerHTML = `<span>จำนวนบิล ${ids.length} บิล</span><b>฿${totalRevenue.toLocaleString()}</b>`;

  if(ids.length === 0){
    listEl.innerHTML = `<div class="empty-note">ไม่มีรายการขายในช่วงเวลานี้</div>`;
    return;
  }

  const methodLabel = {cash:'เงินสด',transfer:'โอนเงิน',qr:'QR Payment',other:'อื่นๆ'};
  listEl.innerHTML = ids.map(id=>{
    const b = billsCache[id];
    const time = new Date(b.date).toLocaleString('th-TH', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
    const status = b.status || 'paid';
    const statusLabel = {paid:'ชำระแล้ว', unpaid:'ค้างชำระ', returned:'คืนสินค้าแล้ว', cancelled:'ยกเลิกแล้ว'}[status] || status;
    return `<div class="bill-item" data-id="${id}">
      <div class="brow">
        <div>
          <div class="btime">${escH(docNoOf(b,id))} · ${time}</div>
          <div class="bmeta">${b.items.length} รายการ · ${methodLabel[b.paymentMethod]||'-'} · ${b.staffName}</div>
          <span class="status-badge ${status}">${statusLabel}</span>
        </div>
        <div class="btotal">฿${b.total.toLocaleString()}</div>
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('.bill-item').forEach(el=>{
    el.onclick = ()=> openBillDetail(el.dataset.id);
  });
}

function openBillDetail(billId){
  const b = billsCache[billId];
  const methodLabel = {cash:'เงินสด',transfer:'โอนเงิน',qr:'QR Payment',other:'อื่นๆ'};
  const status = b.status || 'paid';
  const sheet = document.getElementById('modalSheet');
  sheet.innerHTML = `
    <h2>รายละเอียดบิล</h2>
    <div class="detail-line"><span>เลขที่บิล</span><span><b>${escH(docNoOf(b,billId))}</b></span></div>
    ${b.items.map(it=>`<div class="detail-line item"><span>${it.name} x${it.qty}</span><span>฿${(it.price*it.qty - (it.discount||0)).toLocaleString()}</span></div>`).join('')}
    <div class="detail-line"><span>ยอดรวมสินค้า</span><span>฿${b.subtotal.toLocaleString()}</span></div>
    <div class="detail-line"><span>ส่วนลดบิล</span><span>-฿${(b.billDiscount||0).toLocaleString()}</span></div>
    <div class="detail-line grand"><span>ยอดสุทธิ</span><span>฿${b.total.toLocaleString()}</span></div>
    <div class="detail-line" style="margin-top:10px"><span>วิธีชำระ</span><span>${methodLabel[b.paymentMethod]||'-'}</span></div>
    ${b.paymentMethod==='cash' ? `<div class="detail-line"><span>รับเงิน / ทอน</span><span>฿${(b.cashReceived||0).toLocaleString()} / ฿${(b.change||0).toLocaleString()}</span></div>` : ''}
    <div class="detail-line"><span>พนักงาน</span><span>${b.staffName}</span></div>
    <div class="detail-line"><span>สถานะ</span><span>${status}</span></div>
    <div class="modal-actions">
      <button class="primary" id="printBillBtn">🖨️ พิมพ์ใบเสร็จ</button>
      <button id="taxInvBtn">📄 ใบกำกับภาษีเต็มรูป</button>
      ${status==='paid' ? `<button id="returnBillBtn">↩️ คืนสินค้า (คืนทั้งบิล)</button>` : ''}
      ${status!=='cancelled' && status!=='returned' ? `<button class="danger" id="cancelBillBtn">✕ ยกเลิกบิล</button>` : ''}
      <button id="closeBtn">ปิด</button>
    </div>
  `;
  document.getElementById('printBillBtn').onclick = ()=> printBill(b, billId);
  document.getElementById('taxInvBtn').onclick = ()=> printTaxInvoice(b, billId);
  document.getElementById('closeBtn').onclick = closeModal;
  const returnBtn = document.getElementById('returnBillBtn');
  if(returnBtn) returnBtn.onclick = ()=> confirmBillAction(billId, 'return');
  const cancelBtn = document.getElementById('cancelBillBtn');
  if(cancelBtn) cancelBtn.onclick = ()=> confirmBillAction(billId, 'cancel');
  document.getElementById('modalOverlay').classList.add('show');
}

function confirmBillAction(billId, action){
  const label = action === 'return' ? 'คืนสินค้าทั้งบิลนี้' : 'ยกเลิกบิลนี้';
  if(!confirm(`ยืนยัน "${label}"? ระบบจะคืนสต็อกสินค้าทั้งหมดในบิลกลับเข้าคลัง`)) return;

  const b = billsCache[billId];
  const basePath = `shops/${currentBranch.shopId}/branches/${currentBranch.branchId}`;
  const logType = action === 'return' ? 'return' : 'adjust-up';
  const reason = action === 'return' ? 'ลูกค้าคืนสินค้า' : 'ยกเลิกบิล';

  const promises = b.items.map(it=>
    db.ref(`${basePath}/products/${it.productId}/stock`).transaction(cur=> (cur||0) + it.qty)
      .then(()=> db.ref(`${basePath}/stockLog`).push().set({
        type: logType, productId: it.productId, productName: it.name, qty: it.qty,
        staffName: session.name, reason, date: Date.now()
      }))
  );
  Promise.all(promises).then(()=>{
    return db.ref(`${basePath}/bills/${billId}/status`).set(action === 'return' ? 'returned' : 'cancelled');
  }).then(()=>{
    closeModal();
  }).catch(err=>{
    alert('เกิดข้อผิดพลาด: ' + err.message);
  });
}

function printBill(b, id){
  const area = document.getElementById('printArea');
  area.style.width = shopSettings.paperWidth === '80' ? '300px' : '220px';
  area.innerHTML = receiptHTML(shopSettings, b, id);
  setTimeout(()=> window.print(), 300);
}

function printTaxInvoice(b, id){
  if(!shopSettings.taxId) alert('หมายเหตุ: ยังไม่ได้ตั้งเลขประจำตัวผู้เสียภาษีของร้านในหน้าตั้งค่า');
  const name = prompt('ชื่อผู้ซื้อ (เว้นว่างได้ — จะเว้นไว้ให้เขียนมือ)'); if(name === null) return;
  const address = prompt('ที่อยู่ผู้ซื้อ'); if(address === null) return;
  const taxId = prompt('เลขประจำตัวผู้เสียภาษีของผู้ซื้อ'); if(taxId === null) return;
  const base = `shops/${currentBranch.shopId}/branches/${currentBranch.branchId}`;
  db.ref(base + '/invoiceDesign').once('value').then(sn=>{
    const r = renderInvoiceHTML(sn.val() || {}, shopSettings, b, id, { name, address, taxId });
    const area = document.getElementById('printArea');
    area.style.width = r.width; area.innerHTML = r.html;
    setTimeout(()=> window.print(), 300);
  });
}

/* ===== เอกสาร: ใบเสร็จ / ใบกำกับภาษี (ใช้ร่วมกัน) ===== */
function escH(t){ return String(t==null?'':t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function thMoney(n){ return (Number(n)||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function docNoOf(b, id){ return b.billNo || ('เก่า-' + String(id||'').slice(-6).toUpperCase()); }
const DEFAULT_DESIGN = { paper:'a4', title:'ใบกำกับภาษี / ใบเสร็จรับเงิน', branchText:'สำนักงานใหญ่', showLogo:true, showAddress:true, showPhone:true, showBranch:true, showUnitPrice:true, showDiscount:true, showSignature:true, showCopyLabel:true, accent:'#1d4ed8', footer:'' };

function receiptHTML(S, b, id){
  const mL = {cash:'เงินสด',transfer:'โอนเงิน',qr:'QR Payment',other:'อื่นๆ'};
  const vr = S.vatRate ?? 7;
  const vatLine = S.taxInvoiceEnabled ? `<div class="pline"><span>VAT ${vr}%</span><span>฿${(b.total - b.total/(1+vr/100)).toLocaleString(undefined,{maximumFractionDigits:2})}</span></div>` : '';
  return `
    ${S.logoUrl ? `<img src="${escH(S.logoUrl)}" style="max-width:80px; display:block; margin:0 auto 6px;">` : ''}
    <h2>${escH(S.shopName||'ร้านค้า')}</h2>
    ${S.address ? `<div style="text-align:center; font-size:10.5px; margin-bottom:4px;">${escH(S.address)}</div>` : ''}
    ${S.phone ? `<div style="text-align:center; font-size:10.5px; margin-bottom:4px;">โทร. ${escH(S.phone)}</div>` : ''}
    ${S.taxId ? `<div style="text-align:center; font-size:10.5px; margin-bottom:8px;">เลขผู้เสียภาษี ${escH(S.taxId)}</div>` : ''}
    <div style="text-align:center; font-family:'Kanit'; font-weight:bold; margin-bottom:6px;">ใบเสร็จรับเงิน${S.taxInvoiceEnabled ? ' / ใบกำกับภาษี' : ''}</div>
    <div class="pline"><span>เลขที่บิล</span><span><b>${escH(docNoOf(b,id))}</b></span></div>
    <div class="pline"><span>วันที่</span><span>${new Date(b.date).toLocaleString('th-TH')}</span></div>
    <div class="pline"><span>พนักงาน</span><span>${escH(b.staffName)}</span></div>
    <div style="margin:8px 0; border-top:1px dashed #000;"></div>
    ${(b.items||[]).map(it=>`<div class="pline"><span>${escH(it.name)} x${it.qty}</span><span>฿${(it.price*it.qty-(it.discount||0)).toLocaleString()}</span></div>`).join('')}
    <div class="pline ptotal"><span>ยอดสุทธิ</span><span>฿${b.total.toLocaleString()}</span></div>
    ${vatLine}
    <div class="pline"><span>ชำระโดย</span><span>${mL[b.paymentMethod]||'-'}</span></div>
    ${S.receiptFooter ? `<div style="text-align:center; font-size:10.5px; margin-top:10px; border-top:1px dashed #000; padding-top:6px;">${escH(S.receiptFooter)}</div>` : ''}`;
}

function renderInvoiceHTML(D, S, b, id, buyer){
  D = Object.assign({}, DEFAULT_DESIGN, D || {}); buyer = buyer || {}; S = S || {};
  const slip = D.paper !== 'a4';
  const width = D.paper === 'a4' ? '700px' : (D.paper === '80' ? '300px' : '220px');
  const vr = Number(S.vatRate ?? 7) || 0;
  const total = Number(b.total) || 0, base = total/(1+vr/100), vat = total - base;
  const col = D.accent || '#1d4ed8', fs = slip ? 11 : 13;
  const dots = '................................';
  const head = `<div style="text-align:center">${D.showLogo && S.logoUrl ? `<img src="${escH(S.logoUrl)}" style="max-height:${slip?50:70}px;margin-bottom:4px"><br>` : ''}
    <b style="font-size:${slip?14:18}px;font-family:Kanit">${escH(S.shopName||'ร้านค้า')}</b>
    ${D.showAddress && S.address ? `<div>${escH(S.address)}</div>` : ''}${D.showPhone && S.phone ? `<div>โทร. ${escH(S.phone)}</div>` : ''}
    <div>เลขประจำตัวผู้เสียภาษี ${escH(S.taxId||'-')}${D.showBranch && D.branchText ? ' · ' + escH(D.branchText) : ''}</div></div>`;
  const title = `<div style="margin:8px 0;padding:6px;background:${col};color:#fff;text-align:center;font-family:Kanit;font-size:${slip?13:16}px;-webkit-print-color-adjust:exact;print-color-adjust:exact">${escH(D.title)}${D.showCopyLabel ? ' (ต้นฉบับ)' : ''}</div>`;
  const meta = `<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px"><span>เลขที่ <b>${escH(docNoOf(b,id))}</b></span><span>วันที่ ${new Date(b.date).toLocaleString('th-TH')}</span></div>`;
  const buyerBox = `<div style="border:1px solid #999;padding:6px;margin:6px 0"><div>ผู้ซื้อ: ${buyer.name ? escH(buyer.name) : dots}</div><div>ที่อยู่: ${buyer.address ? escH(buyer.address) : dots}</div><div>เลขประจำตัวผู้เสียภาษี: ${buyer.taxId ? escH(buyer.taxId) : dots}</div></div>`;
  const showUnit = !slip && D.showUnitPrice, showDisc = !slip && D.showDiscount;
  const rows = (b.items||[]).map((it,i)=>`<tr><td>${i+1}</td><td>${escH(it.name)}</td><td style="text-align:right">${it.qty}</td>${showUnit?`<td style="text-align:right">${thMoney(it.price)}</td>`:''}${showDisc?`<td style="text-align:right">${thMoney(it.discount||0)}</td>`:''}<td style="text-align:right">${thMoney(it.price*it.qty-(it.discount||0))}</td></tr>`).join('');
  const table = `<style>.inv td,.inv th{border-bottom:1px solid #ddd;padding:3px}</style><table class="inv" style="width:100%;border-collapse:collapse;font-size:${fs}px"><tr style="background:#eee"><th>#</th><th style="text-align:left">รายการ</th><th>จำนวน</th>${showUnit?'<th>ราคา/หน่วย</th>':''}${showDisc?'<th>ส่วนลด</th>':''}<th>รวม</th></tr>${rows}</table>`;
  const r2 = (l,v)=>`<div style="display:flex;justify-content:space-between"><span>${l}</span><span>${v}</span></div>`;
  const bd = Number(b.billDiscount) || 0;
  const totals = `<div style="margin-top:8px;margin-left:auto;width:${slip?'100%':'55%'}">${bd?r2('ส่วนลดบิล','-'+thMoney(bd)):''}${r2('มูลค่าสินค้า (ก่อนภาษี)',thMoney(base))}${r2('ภาษีมูลค่าเพิ่ม '+vr+'%',thMoney(vat))}
    <div style="display:flex;justify-content:space-between;font-weight:bold;font-size:${fs+3}px;border-top:2px solid #000;margin-top:4px;padding-top:4px"><span>รวมทั้งสิ้น</span><span>${thMoney(total)}</span></div>
    <div style="font-size:${fs-2}px;color:#555">ราคารวมภาษีมูลค่าเพิ่มแล้ว</div></div>`;
  const sign = D.showSignature ? `<div style="display:flex;justify-content:space-around;margin-top:${slip?16:36}px;text-align:center;font-size:${fs}px"><div>..............................<br>ผู้รับเงิน</div><div>..............................<br>ผู้ซื้อ</div></div>` : '';
  const foot = D.footer ? `<div style="text-align:center;font-size:${fs-1}px;margin-top:10px;border-top:1px dashed #000;padding-top:6px">${escH(D.footer)}</div>` : '';
  return { width, html: `<div style="font-family:Sarabun,sans-serif;font-size:${fs}px;color:#000;background:#fff">${head}${title}${meta}${buyerBox}${table}${totals}${sign}${foot}</div>` };
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}
</script>
<script>
/* ===== สิทธิ์ใช้เมนูรายหัวข้อ (users/{uid}/menus) — ตั้งค่าที่หน้าพนักงาน ===== */
(function(){
  var PAGE_KEY = "sales";
  var MAP = {"dashboard.html": "dashboard", "sell.html": "sell", "products.html": "products", "stock.html": "stock", "receive.html": "receive", "pricetag.html": "pricetag", "promotions.html": "promotions", "sales.html": "sales", "debtors.html": "debtors", "reports.html": "reports", "addproduct.html": "addproduct", "settings.html": "settings"};
  var ALL = ['dashboard','sell','products','stock','stockAdjust','receive','pricetag','promotions','sales','debtors','reports','addproduct','settings'];
  var s = null; try{ s = JSON.parse(localStorage.getItem('shopSession')); }catch(e){}
  if(!s || !s.uid || s.role === 'admin') return;
  try{
    firebase.database().ref('users/' + s.uid).once('value').then(function(sn){
      var u = sn.val(); if(!u) return;
      var menus = u.menus || null, oldDeny = u.deny || {};
      if(menus){
        var p = Object.assign({}, u.permissions || {});
        p.sell = !!menus.sell; p.addProduct = !!(menus.addproduct || menus.receive || menus.pricetag);
        p.editPrice = !!menus.promotions; p.viewReport = !!(menus.reports || menus.sales); p.manageSystem = !!menus.settings;
        var need = JSON.stringify(p) !== JSON.stringify(s.permissions || {});
        if(need && !sessionStorage.getItem('menuSyncDone')){
          s.permissions = p; localStorage.setItem('shopSession', JSON.stringify(s));
          sessionStorage.setItem('menuSyncDone', '1'); location.reload(); return;
        }
        if(!need) sessionStorage.removeItem('menuSyncDone');
      }
      function blocked(k){ return menus ? !menus[k] : !!oldDeny[k]; }
      var deny = {}; ALL.forEach(function(k){ deny[k] = blocked(k); });
      window.__deny = deny;
      if(deny.stockAdjust){ var st = document.createElement('style'); st.textContent = '.adj-btn{display:none !important}'; document.head.appendChild(st); }
      function hide(){
        document.querySelectorAll('a[href], [data-href]').forEach(function(el){
          var h = el.getAttribute('href') || el.getAttribute('data-href'); var k = MAP[h];
          if(k && deny[k]) el.style.display = 'none';
        });
      }
      hide(); new MutationObserver(hide).observe(document.body, {childList:true, subtree:true});
      if(PAGE_KEY && deny[PAGE_KEY]){
        document.body.innerHTML = '<div style="text-align:center;padding:80px 20px;font-family:Sarabun,sans-serif;color:#f1f5f9"><h2>🚫 ไม่มีสิทธิ์ใช้เมนูนี้</h2><p style="color:#94a3b8;margin-top:8px">กำลังกลับหน้าหลัก...</p></div>';
        setTimeout(function(){ location.href = 'home.html'; }, 1500);
      }
    });
  }catch(e){}
})();
</script>
