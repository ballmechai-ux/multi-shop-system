<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ขายสินค้า</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><style>:root{--bg:#060b16;--p:#0d1526;--p2:#111d33;--b:#1c2b45;--t:#22d3ee;--g:#fbbf24;--tx:#e8edf5;--s:#7c8aa5;--d:#f87171}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Sarabun,system-ui;padding:14px}.wrap{max-width:900px;margin:auto}.top,.panel,.card{background:var(--p);border:1px solid var(--b);border-radius:16px}.top{padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}.title{font:600 18px Kanit}.sub{font-size:12px;color:var(--s)}.panel{padding:15px;margin-bottom:12px}.btn{border:1px solid var(--b);background:var(--p2);color:var(--tx);border-radius:10px;padding:9px 12px}.primary{color:var(--t);border-color:#22d3ee66}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}.card{padding:12px;cursor:pointer;background:var(--p2)}.price{color:var(--g);font-family:Kanit}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--b)}.row:last-child{border:0}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}.field label{font-size:11px;color:var(--s)}input{width:100%;padding:10px;border-radius:9px;border:1px solid var(--b);background:#081122;color:var(--tx)}.total{font:600 22px Kanit;color:var(--t);text-align:right;margin:12px 0}.empty{text-align:center;color:var(--s);padding:25px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#15233b;border:1px solid var(--b);padding:10px 15px;border-radius:10px;opacity:0}.toast.show{opacity:1}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><div class="title">🛒 ขายสินค้า</div><div class="sub" id="ctx">กำลังโหลด...</div></div><button class="btn" onclick="location.href='dashboard.html'">← Dashboard</button></div><div class="grid"><div class="panel"><div class="row"><b>สินค้า</b><button class="btn" onclick="load()">↻</button></div><div id="products" class="cards"></div></div><div class="panel"><b>ตะกร้า</b><div id="cart"></div><div class="total" id="total">฿0</div><button class="btn primary" onclick="pay('cash')">💵 เงินสด</button> <button class="btn" onclick="pay('transfer')">📱 โอน</button> <button class="btn" onclick="pay('debt')">📒 ยังไม่จ่าย</button></div></div></div><div id="toast" class="toast"></div><script>const firebaseConfig={apiKey:"AIzaSyDmWjzmkCTjih7G1smod3-B8pR5OMxxud0",authDomain:"multi-shop-system.firebaseapp.com",databaseURL:"https://multi-shop-system-default-rtdb.asia-southeast1.firebasedatabase.app/",projectId:"multi-shop-system",storageBucket:"multi-shop-system.firebasestorage.app",messagingSenderId:"99369473058",appId:"1:99369473058:web:07bd5fbc308f79f18ee67b"};firebase.initializeApp(firebaseConfig);const db=firebase.database();let b,ps={},cart={};function init(){b=branch();if(!b)return;document.getElementById('ctx').textContent='ร้าน/สาขาที่เลือก';load()}function load(){db.ref(`shops/${b.shopId}/branches/${b.branchId}/products`).once('value').then(s=>{ps=s.val()||{};document.getElementById('products').innerHTML=Object.entries(ps).filter(x=>Number(x[1].stock||0)>0).map(([id,p])=>`<div class="card" onclick="add('${esc(id)}')"><b>${esc(p.name||id)}</b><div class="sub">เหลือ ${p.stock}</div><div class="price">฿${Number(p.price||0).toLocaleString()}</div></div>`).join('')||'<div class="empty">ยังไม่มีสินค้า</div>'})}function add(id){let p=ps[id];cart[id]=cart[id]||{...p,id,qty:0};if(cart[id].qty>=Number(p.stock||0))return toast('สินค้าไม่พอ');cart[id].qty++;draw()}function draw(){let a=Object.values(cart);document.getElementById('cart').innerHTML=a.map(x=>`<div class="row">${esc(x.name)} × ${x.qty}<span>฿${(x.price*x.qty).toLocaleString()} <button class="btn" onclick="delete cart['${esc(x.id)}'];draw()">×</button></span></div>`).join('')||'<div class="empty">ยังไม่มีรายการ</div>';document.getElementById('total').textContent='฿'+a.reduce((s,x)=>s+x.price*x.qty,0).toLocaleString()}function pay(method){let a=Object.values(cart);if(!a.length)return toast('ยังไม่มีสินค้า');let total=a.reduce((s,x)=>s+x.price*x.qty,0),id='B'+Date.now(),updates={};if(method==='debt'){let name=prompt('ชื่อลูกหนี้');if(!name)return;updates[`shops/${b.shopId}/branches/${b.branchId}/debts/${id}`]={billId:id,customerName:name,total,paid:0,status:'unpaid',date:new Date().toISOString()}}updates[`shops/${b.shopId}/branches/${b.branchId}/bills/${id}`]={id,date:new Date().toISOString(),total,method,status:method==='debt'?'unpaid':'paid',items:a.map(x=>({id:x.id,name:x.name,qty:x.qty,price:x.price}))};a.forEach(x=>updates[`shops/${b.shopId}/branches/${b.branchId}/products/${x.id}/stock`]=Number(x.stock)-x.qty);db.ref().update(updates).then(()=>{toast('บันทึกการขายแล้ว');cart={};draw();load()}).catch(e=>toast(e.message))}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}let session=null;try{session=JSON.parse(localStorage.getItem('shopSession')||'null')}catch(e){}function branch(){if(session.currentShopId&&session.currentBranchId)return{shopId:session.currentShopId,branchId:session.currentBranchId};toast('กลับ Dashboard แล้วเลือกสาขาก่อน');return null}if(session)init();else document.body.innerHTML=`<div class="empty">ยังไม่ได้เข้าสู่ระบบ<br><button class="btn" onclick="location.href='login.html'">เข้าสู่ระบบ</button></div>`;</script></body></html>
