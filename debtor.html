<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ข้อมูลลูกค้า - บันทึกหนี้</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg1:#0f172a; --bg2:#1e293b; --card:#1e293b; --accent:#3b82f6; --accent2:#2563eb;
    --text:#f1f5f9; --sub:#94a3b8; --danger:#ef4444; --ok:#22c55e; --border:#334155;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Sarabun',sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh; color:var(--text); padding:16px; padding-bottom:60px;
  }
  .wrap{ max-width:520px; margin:0 auto; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .topbar h1{ font-family:'Kanit'; font-size:17px; }
  .back-link{ color:var(--accent); font-size:13px; cursor:pointer; }

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:18px; margin-bottom:14px;
  }
  .card h2{ font-family:'Kanit'; font-size:14.5px; margin-bottom:12px; }
  label{ font-size:12.5px; color:var(--sub); display:block; margin-bottom:5px; }
  input{
    width:100%; padding:12px 13px; margin-bottom:10px; border-radius:12px;
    border:1px solid var(--border); background:#0f172a; color:var(--text); font-size:14px; font-family:'Sarabun';
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .bill-line{ display:flex; justify-content:space-between; font-size:13px; padding:5px 0; color:var(--sub); }
  .bill-line.item{ color:var(--text); }
  .bill-line.grand{ font-family:'Kanit'; font-size:19px; color:var(--text); border-top:1px solid var(--border); margin-top:8px; padding-top:10px; }

  canvas{
    width:100%; height:160px; background:#0f172a; border:1px dashed var(--border);
    border-radius:12px; touch-action:none;
  }
  .sig-actions{ display:flex; justify-content:space-between; margin-top:8px; }
  .sig-actions span{ font-size:12px; color:var(--accent); cursor:pointer; }

  .btn{
    width:100%; padding:15px; border:none; border-radius:14px; background:var(--accent);
    color:#fff; font-family:'Kanit'; font-size:16px; font-weight:500; cursor:pointer; margin-top:6px;
  }
  .btn.outline{ background:transparent; border:1px solid var(--border); color:var(--sub); margin-top:10px; }
  .msg{ font-size:13px; margin-top:8px; min-height:16px; }
  .msg.error{ color:var(--danger); }
  .msg.ok{ color:var(--ok); }

  .empty-note{ text-align:center; color:var(--sub); font-size:13px; padding:40px 20px; }
  .blocked{ text-align:center; padding:60px 20px; color:var(--sub); }
  .blocked h1{ font-family:'Kanit'; color:var(--text); font-size:20px; margin-bottom:10px; }
  .success-screen{ text-align:center; padding:30px 10px; }
  .success-icon{ font-size:48px; margin-bottom:10px; }

  /* Printable invoice, hidden off-screen until print */
  #printArea{ position:absolute; left:-9999px; top:0; width:320px; background:#fff; color:#000; padding:16px; font-family:'Sarabun'; }
  #printArea h2{ font-family:'Kanit'; text-align:center; font-size:16px; margin-bottom:6px; }
  #printArea table{ width:100%; border-collapse:collapse; font-size:12px; margin:8px 0; }
  #printArea td{ padding:3px 0; }
  #printArea .pline{ display:flex; justify-content:space-between; font-size:12px; padding:2px 0; }
  #printArea .ptotal{ font-weight:bold; font-size:14px; border-top:1px solid #000; margin-top:6px; padding-top:6px; }
  #printArea img.sig{ width:140px; margin-top:6px; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ position:absolute; left:0; top:0; }
  }
</style>
</head>
<body>
<div id="app"><div class="blocked">กำลังโหลด...</div></div>
<div id="printArea"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDmWjzmkCTjih7G1smod3-B8pR5OMxxud0",
  authDomain: "multi-shop-system.firebaseapp.com",
  databaseURL: "https://multi-shop-system-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "multi-shop-system",
  storageBucket: "multi-shop-system.firebasestorage.app",
  messagingSenderId: "99369473058",
  appId: "1:99369473058:web:07bd5fbc308f79f18ee67b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const app = document.getElementById('app');

const sessionRaw = localStorage.getItem('shopSession');
let session = null;
try{ session = JSON.parse(sessionRaw); }catch(e){}

let sale = null;
try{ sale = JSON.parse(localStorage.getItem('pendingSale')); }catch(e){}

let shopSettings = {};

let sigCtx = null, drawing = false, hasSignature = false;
let photoData = null;

if(!session){
  app.innerHTML = `<div class="blocked"><h1>ยังไม่ได้เข้าสู่ระบบ</h1><br><a href="login.html" style="color:#3b82f6;">ไปหน้าเข้าสู่ระบบ</a></div>`;
} else if(!sale || !sale.items || sale.items.length === 0){
  app.innerHTML = `
    <div class="wrap">
      <div class="topbar"><h1>📒 ข้อมูลลูกค้า</h1></div>
      <div class="empty-note">ยังไม่มีรายการที่รอบันทึกเป็นหนี้<br><br><a href="sell.html" style="color:#3b82f6;">← กลับไปหน้าขายสินค้า</a></div>
    </div>`;
} else {
  db.ref(`shops/${sale.shopId}/branches/${sale.branchId}/settings`).once('value').then(snap=>{
    shopSettings = snap.val() || {};
    render();
  });
}

function render(){
  app.innerHTML = `
    <div class="wrap">
      <div class="topbar">
        <h1>📒 บันทึกหนี้ลูกค้า</h1>
        <span class="back-link" onclick="location.href='pay.html'">← กลับ</span>
      </div>

      <div class="card">
        <h2>รายการสินค้า</h2>
        ${sale.items.map(it=>`<div class="bill-line item"><span>${it.name} x${it.qty}</span><span>฿${(it.price*it.qty - (it.discount||0)).toLocaleString()}</span></div>`).join('')}
        <div class="bill-line grand"><span>ยอดรวม</span><span>฿${sale.grandTotal.toLocaleString()}</span></div>
      </div>

      <div class="card">
        <h2>ข้อมูลลูกค้า</h2>
        <label>เลขบัตรประชาชน</label>
        <input id="cid" inputmode="numeric" maxlength="13" placeholder="เลขบัตรประชาชน 13 หลัก">
        <div class="row2">
          <div><label>ชื่อ</label><input id="cfname" placeholder="ชื่อ"></div>
          <div><label>นามสกุล</label><input id="clname" placeholder="นามสกุล"></div>
        </div>
        <div class="row2">
          <div><label>บ้านเลขที่</label><input id="chouse" placeholder="บ้านเลขที่"></div>
          <div><label>หมู่</label><input id="cmoo" placeholder="หมู่"></div>
        </div>
        <label>ที่อยู่</label>
        <input id="caddr" placeholder="ตำบล/อำเภอ/จังหวัด">
        <label>เบอร์โทร</label>
        <input id="cphone" inputmode="tel" placeholder="เบอร์โทรศัพท์">
      </div>

      <div class="card">
        <h2>📷 รูปลูกค้า (ไม่บังคับ)</h2>
        <div style="display:flex;gap:12px;align-items:center">
          <img id="phPrev" style="display:none;width:84px;height:84px;object-fit:cover;border-radius:14px;border:1px solid var(--border)">
          <button class="btn outline" id="phBtn" style="margin:0;width:auto;padding:10px 16px;font-size:14px">📷 ถ่ายรูปลูกค้า</button>
          <input type="file" id="phFile" accept="image/*" capture="user" hidden>
        </div>
        <div class="msg" id="phMsg"></div>
      </div>

      <div class="card">
        <h2>✍️ ลายเซ็นลูกค้า</h2>
        <canvas id="sigPad"></canvas>
        <div class="sig-actions">
          <span id="clearSig">ล้างลายเซ็น</span>
          <span id="sigStatus" style="color:#64748b">ยังไม่ได้เซ็น</span>
        </div>
      </div>

      <button class="btn" id="saveBtn">💾 บันทึก + พิมพ์ใบหนี้</button>
      <button class="btn outline" onclick="location.href='sell.html'">ยกเลิก กลับไปหน้าขาย</button>
      <div class="msg" id="saveMsg"></div>
    </div>
  `;

  setupSignaturePad();
  document.getElementById('phBtn').onclick = ()=> document.getElementById('phFile').click();
  document.getElementById('phFile').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    compressImage(f).then(data=>{
      photoData = data; const pv = document.getElementById('phPrev'); pv.src = data; pv.style.display = 'block';
      document.getElementById('phBtn').textContent = '📷 ถ่ายใหม่'; document.getElementById('phMsg').textContent = '';
    }).catch(err=>{ document.getElementById('phMsg').className='msg error'; document.getElementById('phMsg').textContent = err.message; });
  };
  document.getElementById('saveBtn').onclick = saveDebt;
}


function compressImage(file, maxDim, q){
  maxDim = maxDim || 400; q = q || 0.55;
  return new Promise((res, rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      const sc = Math.min(1, maxDim / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = ()=> rej(new Error('อ่านรูปไม่ได้'));
    img.src = url;
  });
}
function showPhotoFull(src){
  const o = document.createElement('div');
  o.style.cssText = 'position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:99';
  o.innerHTML = `<img src="${src}" style="max-width:92%;max-height:88%;border-radius:12px">`;
  o.onclick = ()=> o.remove(); document.body.appendChild(o);
}

function setupSignaturePad(){
  const canvas = document.getElementById('sigPad');
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio;
  canvas.height = canvas.clientHeight * ratio;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(ratio, ratio);
  sigCtx.strokeStyle = '#f1f5f9';
  sigCtx.lineWidth = 2.2;
  sigCtx.lineCap = 'round';

  const getPos = (e)=>{
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  };
  const start = (e)=>{ drawing = true; hasSignature = true; const p = getPos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); document.getElementById('sigStatus').textContent='เซ็นแล้ว'; e.preventDefault(); };
  const move = (e)=>{ if(!drawing) return; const p = getPos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); e.preventDefault(); };
  const end = ()=>{ drawing = false; };

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);

  document.getElementById('clearSig').onclick = ()=>{
    sigCtx.clearRect(0,0,canvas.width,canvas.height);
    hasSignature = false;
    document.getElementById('sigStatus').textContent = 'ยังไม่ได้เซ็น';
  };
}

function saveDebt(){
  const msg = document.getElementById('saveMsg');
  msg.className = 'msg error';
  const fname = document.getElementById('cfname').value.trim();
  const lname = document.getElementById('clname').value.trim();
  const phone = document.getElementById('cphone').value.trim();

  if(!fname){ msg.textContent = 'กรุณากรอกชื่อลูกค้า'; return; }
  if(!hasSignature){ msg.textContent = 'กรุณาให้ลูกค้าเซ็นชื่อก่อนบันทึก'; return; }

  const customer = {
    idCard: document.getElementById('cid').value.trim(),
    firstName: fname,
    lastName: lname,
    houseNo: document.getElementById('chouse').value.trim(),
    moo: document.getElementById('cmoo').value.trim(),
    address: document.getElementById('caddr').value.trim(),
    phone
  };
  const signatureData = document.getElementById('sigPad').toDataURL('image/png');

  const baseChk = `shops/${sale.shopId}/branches/${sale.branchId}`;
  const saveBtn = document.getElementById('saveBtn'); saveBtn.disabled = true;
  Promise.all([ db.ref(baseChk + '/debtors').once('value'), db.ref(baseChk + '/debtConfig').once('value') ]).then(([ds, cs])=>{
    const problem = checkLimits(customer, ds.val() || {}, cs.val() || {});
    if(problem){ msg.textContent = problem; saveBtn.disabled = false; return; }
    doSaveDebt(customer, signatureData);
  }).catch(err=>{ msg.textContent = 'ตรวจวงเงินไม่สำเร็จ: ' + err.message; saveBtn.disabled = false; });
}

function encKey(k){ return btoa(unescape(encodeURIComponent(k))).replace(/[+/=]/g, c=>({'+':'-','/':'_','=':''}[c])); }
function custKey(c){ c=c||{}; return (c.idCard && c.idCard.trim()) || ((c.firstName||'')+' '+(c.lastName||'')+'|'+(c.phone||'')).trim(); }
function checkLimits(customer, debts, cfg){
  const key = custKey(customer); let shopOut = 0, custOut = 0;
  Object.values(debts).forEach(x=>{
    const r = Math.max(0, (x.total||0) - (x.amountPaid||0));
    shopOut += r; if(custKey(x.customer) === key) custOut += r;
  });
  const add = sale.grandTotal || 0;
  const tl = Number(cfg.totalLimit) || 0;
  const co = (cfg.customers || {})[encKey(key)];
  const cl = (co && co.limit != null) ? Number(co.limit) : ((Number(cfg.defaultLimit) || 0) || null);
  const f = n => '฿' + n.toLocaleString();
  if(cl !== null && custOut + add > cl)
    return `เกินวงเงินรายบุคคล: ลูกค้าค้างอยู่ ${f(custOut)} วงเงิน ${f(cl)} (ซื้อเชื่อเพิ่มได้อีก ${f(Math.max(0, cl - custOut))}) บิลนี้ ${f(add)}`;
  if(tl > 0 && shopOut + add > tl)
    return `เกินวงเงินหนี้ของร้าน: ร้านมียอดค้างอยู่ ${f(shopOut)} วงเงิน ${f(tl)} (ให้ซื้อเชื่อเพิ่มได้อีก ${f(Math.max(0, tl - shopOut))}) บิลนี้ ${f(add)}`;
  return '';
}

function doSaveDebt(customer, signatureData){
  const msg = document.getElementById('saveMsg');
  msg.className = 'msg error';
  const basePath = `shops/${sale.shopId}/branches/${sale.branchId}`;
  const debtRef = db.ref(basePath + '/debtors').push();
  const debtData = {
    docNo: debtRef.key.slice(-6).toUpperCase(),
    customer,
    items: sale.items,
    subtotal: sale.subtotal,
    billDiscount: sale.billDiscount || 0,
    total: sale.grandTotal,
    amountPaid: 0,
    status: 'unpaid',
    signature: signatureData,
    staffUid: session.uid,
    staffName: session.name,
    date: Date.now()
  };

  debtRef.set(debtData).then(()=>{
    if(!photoData) return null;
    return db.ref(`${basePath}/debtPhotos/${encKey(custKey(customer))}`).set({ data: photoData, date: Date.now(), staffName: session.name });
  }).then(()=>{
    const promises = sale.items.map(it=>
      db.ref(`${basePath}/products/${it.productId}/stock`).transaction(cur=> Math.max(0, (cur||0) - it.qty))
        .then(()=> db.ref(`${basePath}/stockLog`).push().set({
          type:'sale', productId: it.productId, productName: it.name, qty: it.qty,
          staffName: session.name, date: Date.now()
        }))
    );
    return Promise.all(promises);
  }).then(()=>{
    localStorage.removeItem('pendingSale');
    printInvoice(debtData);
    showSuccess(debtData);
  }).catch(err=>{
    msg.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
  });
}

function printInvoice(debt){
  const area = document.getElementById('printArea');
  area.style.width = shopSettings.paperWidth === '80' ? '300px' : '220px';
  const shopName = shopSettings.shopName || 'ร้านค้า';
  area.innerHTML = `
    ${shopSettings.logoUrl ? `<img src="${shopSettings.logoUrl}" style="max-width:80px; display:block; margin:0 auto 6px;">` : ''}
    <h2>${shopName}</h2>
    ${shopSettings.address ? `<div style="text-align:center; font-size:10.5px; margin-bottom:4px;">${shopSettings.address}</div>` : ''}
    ${shopSettings.phone ? `<div style="text-align:center; font-size:10.5px; margin-bottom:8px;">โทร. ${shopSettings.phone}</div>` : ''}
    <div style="text-align:center; font-family:'Kanit'; font-weight:bold; margin-bottom:6px;">ใบหนี้ / บันทึกค้างชำระ</div>
    <div class="pline"><span>เลขที่เอกสาร</span><span>${debt.docNo}</span></div>
    <div class="pline"><span>วันที่</span><span>${new Date(debt.date).toLocaleDateString('th-TH')}</span></div>
    <div class="pline"><span>ลูกค้า</span><span>${debt.customer.firstName} ${debt.customer.lastName}</span></div>
    <div class="pline"><span>เบอร์โทร</span><span>${debt.customer.phone||'-'}</span></div>
    <table>
      ${debt.items.map(it=>`<tr><td>${it.name} x${it.qty}</td><td style="text-align:right">฿${(it.price*it.qty-(it.discount||0)).toLocaleString()}</td></tr>`).join('')}
    </table>
    <div class="pline ptotal"><span>ยอดค้างชำระ</span><span>฿${debt.total.toLocaleString()}</span></div>
    <div style="margin-top:10px; font-size:11px;">ลายเซ็นลูกค้า</div>
    <img class="sig" src="${debt.signature}">
    ${shopSettings.receiptFooter ? `<div style="text-align:center; font-size:10.5px; margin-top:10px; border-top:1px dashed #000; padding-top:6px;">${shopSettings.receiptFooter}</div>` : ''}
  `;
  setTimeout(()=> window.print(), 300);
}

function showSuccess(debt){
  app.innerHTML = `
    <div class="wrap">
      <div class="success-screen">
        <div class="success-icon">✅</div>
        <h1 style="font-family:'Kanit'">บันทึกหนี้สำเร็จ</h1>
        <div class="card" style="text-align:left; margin-top:16px;">
          <div class="bill-line"><span>เลขที่เอกสาร</span><span>${debt.docNo}</span></div>
          <div class="bill-line"><span>ลูกค้า</span><span>${debt.customer.firstName} ${debt.customer.lastName}</span></div>
          <div class="bill-line grand"><span>ยอดค้างชำระ</span><span>฿${debt.total.toLocaleString()}</span></div>
        </div>
        <button class="btn" onclick="window.print()">🖨️ พิมพ์ใบหนี้อีกครั้ง</button>
        <button class="btn outline" onclick="location.href='sell.html'">🛒 ขายรายการถัดไป</button>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
