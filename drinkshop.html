<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>เมนูร้านน้ำปั่น</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{ --bg:#f0fdfa; --card:#ffffff; --ink:#134e4a; --sub:#5f8a85; --line:#cdeae6; --main:#0d9488; --main2:#14b8a6; }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{ font-family:'Sarabun',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; padding-bottom:50px; }
  .wrap{ max-width:620px; margin:0 auto; padding:0 14px; }
  @media (min-width:900px){ .wrap{ max-width:940px; } }
  .banner{ background:linear-gradient(135deg,#0d9488,#2dd4bf); color:#fff; padding:14px 16px 46px; border-radius:0 0 30px 30px; margin:0 -14px; }
  .bn-top{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:10px; }
  .bn-top a, .back-link{ color:#fff; text-decoration:none; cursor:pointer; font-size:13px; }
  .bn-main{ display:flex; align-items:center; gap:12px; }
  .bn-main h1{ font-family:'Kanit'; font-size:22px; line-height:1.15; }
  .logo{ width:56px; height:56px; border-radius:18px; overflow:hidden; background:#ffffff33; border:2px solid #ffffff66; display:none; align-items:center; justify-content:center; flex-direction:column; cursor:pointer; color:#fff; font-size:20px; flex:none; }
  .logo img{ width:100%; height:100%; object-fit:cover; } .logo.empty{ border-style:dashed; } .logo small{ font-size:9px; }
  .where{ font-size:13px; opacity:.95; margin-top:2px; }
  .notice{ background:#fff7ed; border:1px solid #fdba74; color:#c2410c; border-radius:14px; padding:9px 12px; font-size:12.5px; margin-top:12px; }
  .kpis{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:-28px; margin-bottom:6px; }
  @media (min-width:900px){ .kpis{ grid-template-columns:repeat(4,1fr); } }
  .kpi{ background:var(--card); border-radius:20px; padding:12px 14px; box-shadow:0 4px 14px #0d948822; text-decoration:none; color:var(--ink); }
  .kpi .v{ font-family:'Kanit'; font-size:22px; color:var(--main); } .kpi .l{ font-size:12px; color:var(--sub); margin-top:2px; }
  .sec{ font-family:'Kanit'; font-size:15px; margin:20px 2px 10px; display:flex; align-items:center; gap:8px; }
  .sec::before{ content:''; width:6px; height:18px; border-radius:4px; background:var(--sc,var(--main)); }
  .grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (min-width:900px){ .grid{ grid-template-columns:repeat(4,1fr); } }
  .tile{ display:block; text-decoration:none; color:var(--ink); background:var(--card); border:2px solid var(--line); border-radius:22px; padding:14px; min-height:112px; position:relative; }
  .tile:active{ transform:scale(.98); border-color:var(--sc,var(--main)); }
  .tile .ic{ width:46px; height:46px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:24px; background:var(--sb,#ccfbf1); }
  .tile .nm{ font-family:'Kanit'; font-size:14.5px; margin-top:8px; } .tile .ds{ font-size:11.5px; color:var(--sub); margin-top:2px; }
  .tile.edit{ cursor:pointer; } .tile.off{ opacity:.45; } .tile .eye{ position:absolute; top:10px; right:12px; font-size:11.5px; color:var(--main); font-weight:600; } .tile.off .eye{ color:#94a3b8; }
  .tile.soon{ border-style:dashed; opacity:.7; cursor:default; }
  .tile .tag{ display:inline-block; font-size:10.5px; background:#fef3c7; color:#b45309; padding:1px 8px; border-radius:10px; margin-top:4px; }
  :root{ --c0:#0d9488; --c1:#ea580c; --c2:#0284c7; --c3:#7c3aed; --c4:#475569; }
  .c0{ --sc:#0d9488; --sb:#ccfbf1; } .c1{ --sc:#ea580c; --sb:#ffedd5; } .c2{ --sc:#0284c7; --sb:#e0f2fe; } .c3{ --sc:#7c3aed; --sb:#ede9fe; } .c4{ --sc:#475569; --sb:#e2e8f0; }
  #editRow .back-link{ color:var(--main); font-size:14px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDmWjzmkCTjih7G1smod3-B8pR5OMxxud0",
  authDomain: "multi-shop-system.firebaseapp.com",
  databaseURL: "https://multi-shop-system-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "multi-shop-system",
  storageBucket: "multi-shop-system.firebasestorage.app",
  messagingSenderId: "99369473058",
  appId: "1:99369473058:web:07bd5fbc308f79f18ee67b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const app = document.getElementById('app');
let session = null, cb = null;
try{ session = JSON.parse(localStorage.getItem('shopSession')); }catch(e){}
try{ cb = JSON.parse(localStorage.getItem('currentShopBranch')); }catch(e){}
const esc = t => String(t==null?'':t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

if(!session){
  app.innerHTML = `<div style="text-align:center;padding:60px 20px"><h1>ยังไม่ได้เข้าสู่ระบบ</h1><br><a href="login.html" style="color:#3b82f6">ไปหน้าเข้าสู่ระบบ</a></div>`;
} else if(!cb || !cb.shopId || !cb.branchId){
  app.innerHTML = `<div style="text-align:center;padding:60px 20px"><h1>ยังไม่ได้เลือกสาขา</h1><br><a href="home.html" style="color:#3b82f6">ไปหน้าหลักเพื่อเลือกสาขา</a></div>`;
} else {
  start();
}

function start(){
  const isAdmin = session.role === 'admin', perms = session.permissions || {};
  const SEC = [
    { t:'🛒 ขายและออเดอร์', items:[
      { href:'drinksell.html', ic:'🛒', nm:'ขายเครื่องดื่ม', ds:'เมนูปุ่มใหญ่ มีรูป เลือกหมวดได้', show: isAdmin || perms.sell },
      { soon:true, ic:'🧾', nm:'รับออเดอร์ + คิวทำ', ds:'คิวเครื่องดื่มที่ต้องทำ' } ] },
    { t:'📋 เมนูและสูตร', items:[
      { href:'products.html', ic:'📋', nm:'เมนูเครื่องดื่ม', ds:'ดู/ค้นหาเมนูทั้งหมด', show:true },
      { href:'addproduct.html', ic:'➕', nm:'เพิ่มเมนูใหม่', ds:'ตั้งราคา ขนาด ความหวาน ท็อปปิ้ง', show: isAdmin || perms.addProduct },
      { soon:true, ic:'🧪', nm:'สูตรเครื่องดื่ม', ds:'ตัดสต็อกวัตถุดิบตามสูตร' },
      { href:'promotions.html', ic:'🔥', nm:'โปรโมชั่น', ds:'ลดราคาเมนู', show: isAdmin || perms.editPrice },
      { href:'pricetag.html', ic:'🏷️', nm:'ป้ายราคา / ป้ายเมนู', ds:'พิมพ์ป้ายและบาร์โค้ด', show: isAdmin || perms.addProduct } ] },
    { t:'🧊 วัตถุดิบและสต็อก', items:[
      { href:'stock.html', ic:'📊', nm:'สต็อก', ds:'ดูของคงเหลือ ใกล้หมด', show:true },
      { href:'receive.html', ic:'📥', nm:'รับของเข้าร้าน', ds:'รับวัตถุดิบ/ของเข้าร้าน', show: isAdmin || perms.addProduct } ] },
    { t:'📈 บัญชีและรายงาน', items:[
      { href:'sales.html', ic:'🧾', nm:'รายการขาย', ds:'บิล เลขที่บิล ใบเสร็จ', show:true },
      { href:'debtors.html', ic:'📒', nm:'ลูกหนี้', ds:'ชำระหนี้ วงเงิน ประวัติ', show:true },
      { href:'reports.html', ic:'📈', nm:'รายงาน', ds:'ยอดขาย กำไร ขายดี', show: isAdmin || perms.viewReport },
      { href:'dashboard.html', ic:'🏠', nm:'Dashboard', ds:'ภาพรวมวันนี้', show:true } ] }
    ,{ t:'⚙️ ระบบ', items:[
      { href:'shops.html', ic:'🏪', nm:'จัดการร้าน/สาขา', ds:'เพิ่มร้านและสาขา', show: isAdmin },
      { href:'staffs.html', ic:'👨‍💼', nm:'จัดการพนักงาน', ds:'สิทธิ์การใช้เมนู', show: isAdmin },
      { href:'settings.html', ic:'⚙️', nm:'ตั้งค่าร้าน', ds:'ข้อมูลร้าน ใบเสร็จ VAT', show: isAdmin || perms.manageSystem },
      { href:'invoice.html', ic:'📄', nm:'ออกแบบใบกำกับภาษี', ds:'แบบเอกสารภาษี', show: isAdmin || session.role === 'owner' },
      { href:'cleanup.html', ic:'🧹', nm:'ลบข้อมูล', ds:'ลบ พร้อมไฟล์สำรอง', show: isAdmin } ] }
  ];
  app.innerHTML = `
    <div class="wrap">
      <div class="banner">
        <div class="bn-top"><a href="home.html">← เปลี่ยนร้าน/สาขา</a><span id="rmLogo" class="back-link" style="display:none">ลบรูป</span></div>
        <div class="bn-main"><div class="logo" id="logoBox"></div><div><h1>เมนูร้านน้ำปั่น</h1><div class="where" id="whereTxt">กำลังโหลด...</div></div></div>
        <input type="file" id="logoFile" accept="image/*" hidden>
      </div>
      <div id="notice"></div>
      <div class="kpis">
        <div class="kpi"><div class="v" id="kSales">-</div><div class="l">ยอดขายวันนี้</div></div>
        <div class="kpi"><div class="v" id="kBills">-</div><div class="l">จำนวนบิลวันนี้</div></div>
        <div class="kpi"><div class="v" id="kCups">-</div><div class="l">จำนวนแก้ว/ชิ้นที่ขาย</div></div>
        <a class="kpi" href="stock.html"><div class="v" id="kLow" style="color:#ea580c">-</div><div class="l">สินค้าใกล้หมด/หมด</div></a>
      </div>
      <div id="tiles"></div>
      <div id="editRow" style="margin-top:18px;text-align:center"></div>
    </div>
  `;

  const base = `shops/${cb.shopId}/branches/${cb.branchId}`;
  const DEFAULT_HIDDEN = ['pricetag.html','debtors.html'];
  let hidden = null, editMode = false;
  const hk = href => href.replace('.html','');
  const isHidden = i => hidden === null ? DEFAULT_HIDDEN.includes(i.href) : !!hidden[hk(i.href)];
  function renderTiles(){
    const adm = session.role === 'admin' || session.role === 'owner';
    document.getElementById('tiles').innerHTML = SEC.map(s=>{
      const items = s.items.filter(i=> i.soon ? !editMode : (editMode ? adm : (i.show && !isHidden(i))));
      if(!items.length) return '';
      const ci = SEC.indexOf(s) % 5;
      return `<div class="sec" style="--sc:var(--c${ci})">${s.t}</div><div class="grid c${ci}">${items.map(i=>{
        if(i.soon) return `<div class="tile soon"><div class="ic">${i.ic}</div><div class="nm">${i.nm}</div><div class="ds">${i.ds}</div><span class="tag">เร็วๆ นี้</span></div>`;
        if(editMode) return `<div class="tile edit ${isHidden(i)?'off':''}" data-k="${hk(i.href)}"><span class="eye">${isHidden(i)?'ซ่อนอยู่':'แสดง'}</span><div class="ic">${i.ic}</div><div class="nm">${i.nm}</div><div class="ds">${i.ds}</div></div>`;
        return `<a class="tile" href="${i.href}"><div class="ic">${i.ic}</div><div class="nm">${i.nm}</div><div class="ds">${i.ds}</div></a>`;
      }).join('')}</div>`;
    }).join('');
    document.getElementById('editRow').innerHTML = adm ? `<span class="back-link" id="editBtn">${editMode?'✅ เสร็จสิ้น':'⚙️ ปรับเมนูที่แสดง'}</span>${editMode?'<div class="where" style="margin-top:6px">แตะเมนูเพื่อสลับ แสดง/ซ่อน</div>':''}` : '';
    const eb = document.getElementById('editBtn'); if(eb) eb.onclick = ()=>{ editMode = !editMode; renderTiles(); };
    document.getElementById('tiles').onclick = e=>{
      const el = e.target.closest('.tile.edit'); if(!el) return;
      if(hidden === null){ hidden = {}; SEC.forEach(s=>s.items.forEach(i=>{ if(!i.soon) hidden[hk(i.href)] = DEFAULT_HIDDEN.includes(i.href); })); }
      hidden[el.dataset.k] = !hidden[el.dataset.k];
      db.ref(base + '/hubConfig/hiddenTiles').set(hidden);
      renderTiles();
    };
  }
  db.ref(base + '/hubConfig/hiddenTiles').on('value', sn=>{ hidden = sn.val(); renderTiles(); });
  db.ref('shops/' + cb.shopId).once('value').then(sn=>{
    const s = sn.val() || {}, b = (s.branches||{})[cb.branchId] || {};
    document.getElementById('whereTxt').textContent = '📍 ' + ((s.info||{}).name || '') + ' · ' + (b.name || '');
    if((s.info||{}).type && s.info.type !== 'ร้านน้ำปั่น')
      document.getElementById('notice').innerHTML = `<div class="notice">ร้านนี้เป็นประเภท "${esc(s.info.type)}" — เมนูนี้ออกแบบสำหรับร้านน้ำปั่น</div>`;
  });
  const canEdit = session.role === 'admin' || session.role === 'owner';
  const logoBox = document.getElementById('logoBox'), logoFile = document.getElementById('logoFile'), rmLogo = document.getElementById('rmLogo');
  function paintLogo(src){
    logoBox.classList.toggle('empty', !src);
    if(src){ logoBox.innerHTML = `<img src="${src}">`; logoBox.style.display = 'flex'; }
    else if(canEdit){ logoBox.innerHTML = '＋<small>รูป</small>'; logoBox.style.display = 'flex'; }
    else logoBox.style.display = 'none';
    rmLogo.style.display = (src && canEdit) ? 'inline' : 'none';
  }
  function toLogo(file){
    return new Promise((res, rej)=>{
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = ()=>{
        const sc = Math.min(1, 256 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        res(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85));
      };
      img.onerror = ()=> rej(new Error('อ่านรูปไม่ได้')); img.src = url;
    });
  }
  paintLogo(null);
  db.ref(base + '/hubConfig/logo').once('value').then(sn=> paintLogo(sn.val()));
  if(canEdit){
    logoBox.onclick = ()=> logoFile.click();
    logoFile.onchange = e=>{
      const f = e.target.files[0]; if(!f) return;
      toLogo(f).then(data=> db.ref(base + '/hubConfig/logo').set(data).then(()=> paintLogo(data))).catch(err=> alert('บันทึกรูปไม่สำเร็จ: ' + err.message));
    };
    rmLogo.onclick = ()=>{ if(confirm('ลบรูปนี้ออก?')) db.ref(base + '/hubConfig/logo').remove().then(()=> paintLogo(null)); };
  }
  const t0 = new Date(); t0.setHours(0,0,0,0);
  db.ref(base + '/bills').orderByChild('date').startAt(t0.getTime()).once('value').then(sn=>{
    let sales = 0, n = 0, cups = 0;
    Object.values(sn.val() || {}).forEach(b=>{
      if(b.status === 'cancelled' || b.status === 'returned') return;
      n++; sales += b.total || 0; (b.items||[]).forEach(it=>{ cups += it.qty || 0; });
    });
    document.getElementById('kSales').textContent = '฿' + sales.toLocaleString();
    document.getElementById('kBills').textContent = n; document.getElementById('kCups').textContent = cups;
  });
  db.ref(base + '/products').once('value').then(sn=>{
    let low = 0; Object.values(sn.val() || {}).forEach(p=>{ if((p.stock||0) <= (p.reorderPoint ?? 0)) low++; });
    document.getElementById('kLow').textContent = low;
  });
}
</script>
<script>
/* ===== สิทธิ์ใช้เมนูรายหัวข้อ (users/{uid}/menus) — ตั้งค่าที่หน้าพนักงาน ===== */
(function(){
  var PAGE_KEY = null;
  var MAP = {"dashboard.html": "dashboard", "sell.html": "sell", "drinksell.html": "sell", "products.html": "products", "stock.html": "stock", "receive.html": "receive", "pricetag.html": "pricetag", "promotions.html": "promotions", "sales.html": "sales", "debtors.html": "debtors", "reports.html": "reports", "addproduct.html": "addproduct", "settings.html": "settings"};
  var ALL = ['dashboard','sell','products','stock','stockAdjust','receive','pricetag','promotions','sales','debtors','reports','addproduct','settings'];
  var s = null; try{ s = JSON.parse(localStorage.getItem('shopSession')); }catch(e){}
  if(!s || !s.uid || s.role === 'admin') return;
  try{
    firebase.database().ref('users/' + s.uid).once('value').then(function(sn){
      var u = sn.val(); if(!u) return;
      var menus = u.menus || null, oldDeny = u.deny || {};
      if(menus){
        var p = Object.assign({}, u.permissions || {});
        p.sell = !!menus.sell; p.addProduct = !!(menus.addproduct || menus.receive || menus.pricetag);
        p.editPrice = !!menus.promotions; p.viewReport = !!(menus.reports || menus.sales); p.manageSystem = !!menus.settings;
        var need = JSON.stringify(p) !== JSON.stringify(s.permissions || {});
        if(need && !sessionStorage.getItem('menuSyncDone')){
          s.permissions = p; localStorage.setItem('shopSession', JSON.stringify(s));
          sessionStorage.setItem('menuSyncDone', '1'); location.reload(); return;
        }
        if(!need) sessionStorage.removeItem('menuSyncDone');
      }
      function blocked(k){ return menus ? !menus[k] : !!oldDeny[k]; }
      var deny = {}; ALL.forEach(function(k){ deny[k] = blocked(k); });
      window.__deny = deny;
      if(deny.stockAdjust){ var st = document.createElement('style'); st.textContent = '.adj-btn{display:none !important}'; document.head.appendChild(st); }
      function hide(){
        document.querySelectorAll('a[href], [data-href]').forEach(function(el){
          var h = el.getAttribute('href') || el.getAttribute('data-href'); var k = MAP[h];
          if(k && deny[k]) el.style.display = 'none';
        });
      }
      hide(); new MutationObserver(hide).observe(document.body, {childList:true, subtree:true});
      if(PAGE_KEY && deny[PAGE_KEY]){
        document.body.innerHTML = '<div style="text-align:center;padding:80px 20px;font-family:Sarabun,sans-serif;color:#f1f5f9"><h2>🚫 ไม่มีสิทธิ์ใช้เมนูนี้</h2><p style="color:#94a3b8;margin-top:8px">กำลังกลับหน้าหลัก...</p></div>';
        setTimeout(function(){ location.href = 'home.html'; }, 1500);
      }
    });
  }catch(e){}
})();
</script>
</body>
</html>
